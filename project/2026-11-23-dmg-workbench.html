<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DMG Workbench</title>
<meta name="description" content="A workbench for Game Boy (DMG) games written in whack-fluent, a fluent builder grammar with build-time and runtime lambdas, an IR/DAG, proxy diagnostics, sliders and a bot runtime.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
/* DMG Workbench. Kiln look from the Form Skate Workbench (Swiss: white ground, #1a1a1a ink, Arial in two weights,
   1 px rules, no tinted panels; red marks errors, selection and the lambda arrow). The stage keeps the drafting-sheet
   labels in IBM Plex Mono; the screen itself shows the four DMG shades. */
:root {
  --bg: #ffffff; --fill: #f6f6f6; --fill-2: #e6e6e6; --ink: #1a1a1a; --ink-2: #737373;
  --accent: #e2001a; --hair: #d6d6d6; --rule: #ededed; --code-bg: #fbfbfb; --sel: rgba(226, 0, 26, 0.10);
  --tok-key: #1a1a1a; --tok-str: #6b6b6b; --tok-num: #1a1a1a; --tok-expr: #e2001a; --tok-com: #a3a3a3; --tok-punc: #a3a3a3;
  --mono: Arial, "Helvetica Neue", Helvetica, sans-serif; --display: Arial, "Helvetica Neue", Helvetica, sans-serif;
  --code: ui-monospace, Menlo, Consolas, "Courier New", monospace;
  --plex: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --fs-xs: 10.5px; --fs-s: 12px; --fs-m: 13px; --fs-l: 18px; --fs-xl: 30px;
  --scr-bezel: #1a1a1a; --st-bg: #ffffff; --st-ink: #111111; --st-muted: #6e6e6e; --st-major: #dcdcdc;
  --p0: #9bbc0f; --p1: #8bac0f; --p2: #306230; --p3: #0f380f;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1a1a1a; --fill: #222222; --fill-2: #3a3a3a; --ink: #f2f2f2; --ink-2: #9a9a9a; --accent: #ff3b4a;
  --hair: #3d3d3d; --rule: #2a2a2a; --code-bg: #1d1d1d; --sel: rgba(255, 59, 74, 0.16);
  --tok-key: #f2f2f2; --tok-str: #a6a6a6; --tok-num: #f2f2f2; --tok-expr: #ff3b4a; --tok-com: #6e6e6e; --tok-punc: #6e6e6e;
  --scr-bezel: #0d0d0d; --st-bg: #101010; --st-ink: #f2f2f2; --st-muted: #9a9a9a; --st-major: #262626; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1a1a1a; --fill: #222222; --fill-2: #3a3a3a; --ink: #f2f2f2; --ink-2: #9a9a9a; --accent: #ff3b4a;
  --hair: #3d3d3d; --rule: #2a2a2a; --code-bg: #1d1d1d; --sel: rgba(255, 59, 74, 0.16);
  --tok-key: #f2f2f2; --tok-str: #a6a6a6; --tok-num: #f2f2f2; --tok-expr: #ff3b4a; --tok-com: #6e6e6e; --tok-punc: #6e6e6e;
  --scr-bezel: #0d0d0d; --st-bg: #101010; --st-ink: #f2f2f2; --st-muted: #9a9a9a; --st-major: #262626; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font: 400 var(--fs-s)/1.45 var(--mono); overflow: hidden;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
#app { height: 100%; display: flex; flex-direction: column; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
[hidden] { display: none !important; }
.sp { flex: 1; }
.dim { color: var(--ink-2); } .bad { color: var(--accent); }
code { font: 400 11px/1.4 var(--code); }
kbd { font: 400 var(--fs-xs)/1 var(--mono); border: 1px solid var(--hair); padding: 2px 4px; color: var(--ink-2); background: var(--bg); }
.btn { background: none; border: 1px solid var(--hair); padding: 5px 10px; display: inline-flex; gap: 6px; align-items: center; font-size: var(--fs-s); white-space: nowrap; line-height: 1.2; border-radius: 0; }
.btn:hover { border-color: var(--ink); }
.btn:disabled { opacity: 0.4; cursor: default; border-color: var(--hair); }
.btn.on, .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.danger { color: var(--accent); border-color: var(--accent); }
.btn.sm { padding: 3px 8px; font-size: var(--fs-xs); }
.ibtn { background: none; border: 1px solid transparent; min-width: 30px; height: 30px; padding: 0 7px; display: inline-grid; place-items: center; font-size: 13px; color: var(--ink); border-radius: 0; }
.ibtn:hover { border-color: var(--hair); }
.ibtn:disabled { opacity: .35; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--hair); flex-wrap: wrap; }
.seg > button { background: none; border: 0; border-left: 1px solid var(--hair); padding: 0 10px; height: 28px; font-size: var(--fs-s); color: var(--ink-2); white-space: nowrap; border-radius: 0; }
.seg > button:first-child { border-left: 0; }
.seg > button:hover { color: var(--ink); }
.seg > button.on { background: var(--ink); color: var(--bg); }
.seg.sm > button { height: 24px; padding: 0 8px; font-size: var(--fs-xs); }
.tog { background: none; border: 1px solid var(--hair); height: 28px; padding: 0 10px; display: inline-flex; gap: 7px; align-items: center; font-size: var(--fs-s); white-space: nowrap; color: var(--ink-2); border-radius: 0; }
.tog::before { content: ""; width: 9px; height: 9px; border: 1px solid currentColor; flex: none; }
.tog.on { color: var(--ink); } .tog.on::before { background: var(--ink); border-color: var(--ink); }
.tog:hover { border-color: var(--ink); }
.tog:disabled { opacity: .4; cursor: default; }
.tog.sm { height: 24px; padding: 0 8px; font-size: var(--fs-xs); }
.link { background: none; border: 0; padding: 0; color: var(--ink-2); text-decoration: underline; text-underline-offset: 2px; font-size: var(--fs-xs); cursor: pointer; }
.link:hover { color: var(--ink); }
.tag { font-size: 9.5px; border: 1px solid var(--hair); padding: 0 4px; margin-left: 6px; color: var(--ink-2); font-weight: 400; vertical-align: 1px; letter-spacing: .04em; }
.tag.live { border-color: var(--ink); color: var(--ink); }

/* header */
.themeic { width: 14px; height: 14px; border: 1.5px solid var(--ink); border-radius: 50%; background: linear-gradient(90deg, var(--ink) 50%, transparent 50%); display: block; }
.bar { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--hair); height: 52px; padding: 0 10px 0 16px; position: relative; z-index: 20; background: var(--bg); flex: none; }
.brand { font: 700 15px/1 var(--display); white-space: nowrap; padding-right: 12px; border-right: 1px solid var(--hair); height: 24px; display: flex; align-items: center; gap: 8px; letter-spacing: -0.01em; }
.brand i { font-style: normal; font-weight: 400; color: var(--ink-2); font-size: var(--fs-xs); letter-spacing: 0; }
.brand .mark { width: 14px; height: 14px; border: 2px solid var(--ink); position: relative; flex: none; }
.brand .mark::after { content: ""; position: absolute; inset: 2px; background: var(--accent); }
.proj { position: relative; min-width: 0; }
.projbtn { background: none; border: 1px solid transparent; display: flex; align-items: baseline; gap: 8px; padding: 6px 8px; max-width: 340px; border-radius: 0; }
.projbtn:hover { border-color: var(--hair); }
.projbtn .pcode { color: var(--ink-2); font-size: var(--fs-xs); }
.projbtn .ptitle { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.projbtn .caret { color: var(--ink-2); font-size: 10px; }
.pill { background: none; border: 1px solid var(--ink); height: 30px; padding: 0 10px; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; font-variant-numeric: tabular-nums; cursor: default; }
.pill b { font-size: 14px; } .pill span { font-size: var(--fs-xs); color: var(--ink-2); }
.pill.bad { border-color: var(--accent); } .pill.bad b, .pill.bad span { color: var(--accent); }
.pill.btnish { cursor: pointer; }
.menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 40; min-width: 320px; max-height: 76vh; overflow: auto; background: var(--bg); border: 1px solid var(--ink); display: flex; flex-direction: column; padding: 4px 0; }
.menu.right { left: auto; right: 0; min-width: 240px; }
.menu button { background: none; border: 0; text-align: left; padding: 7px 14px; display: flex; gap: 10px; align-items: baseline; font-size: var(--fs-s); border-radius: 0; }
.menu button:hover { background: var(--fill); }
.menu button.on { font-weight: 700; }
.menu small { color: var(--ink-2); font-size: var(--fs-xs); }
.menu .grp { padding: 9px 14px 3px; font-size: var(--fs-xs); color: var(--ink-2); border-top: 1px solid var(--rule); text-transform: uppercase; letter-spacing: .06em; }
.menu .grp:first-child { border-top: 0; }
.menu.presets { min-width: 400px; }
.menu.presets button { display: grid; grid-template-columns: 30px 1fr; gap: 0 8px; }
.menu.presets button .code { color: var(--ink-2); font-size: var(--fs-xs); }
.menu.presets button small { grid-column: 2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 340px; }
.menu.presets button.on { box-shadow: inset 2px 0 0 var(--accent); }
.menu.floating { position: fixed; z-index: 70; min-width: 240px; max-width: min(360px, calc(100vw - 16px)); }
.runctl { display: flex; align-items: center; gap: 2px; padding: 0 4px; flex: none; border-left: 1px solid var(--hair); border-right: 1px solid var(--hair); height: 30px; }
.runctl .clock { font: 700 var(--fs-s)/1 var(--mono); font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; padding: 0 6px; white-space: nowrap; }
.runctl .clock em { font-style: normal; font-weight: 400; color: var(--ink-2); }
.runctl select { height: 26px; border: 1px solid var(--hair); background: var(--bg); padding: 0 4px; font-size: var(--fs-xs); border-radius: 0; }
.toasts { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 80; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; max-width: calc(100% - 32px); }
.toast { background: var(--ink); color: var(--bg); padding: 7px 14px; font-size: var(--fs-s); max-width: 560px; }
.toast.bad { background: var(--accent); color: #fff; }

/* dock: tiles, tabs, gutters, drag and drop */
#work { flex: 1; min-height: 0; display: flex; }
.dock { flex: 1; min-width: 0; min-height: 0; display: flex; position: relative; }
.dsplit { flex: 1; min-width: 0; min-height: 0; display: flex; }
.dsplit.row { flex-direction: row; } .dsplit.col { flex-direction: column; }
.dcell { min-width: 0; min-height: 0; display: flex; }
.gutter { flex: none; background: var(--hair); position: relative; z-index: 3; }
.gutter.row { width: 1px; cursor: col-resize; } .gutter.col { height: 1px; cursor: row-resize; }
.gutter.row::after { content: ""; position: absolute; inset: 0 -4px; } .gutter.col::after { content: ""; position: absolute; inset: -4px 0; }
.gutter:hover { background: var(--ink); }
.tile { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg); position: relative; }
.dstrip { display: flex; align-items: stretch; height: 40px; flex: none; border-bottom: 1px solid var(--hair); }
.dtabs { display: flex; align-items: stretch; min-width: 0; flex: 0 1 auto; overflow-x: auto; scrollbar-width: none; padding-left: 4px; }
.dtabs::-webkit-scrollbar { display: none; }
.dtab { display: flex; align-items: stretch; flex: none; }
.dtab .lbl { background: none; border: 0; padding: 0 2px 0 12px; font-size: var(--fs-m); color: var(--ink-2); display: flex; gap: 6px; align-items: center; white-space: nowrap; cursor: grab; border-radius: 0; touch-action: none; }
.dtab .lbl:hover, .dtab.on .lbl { color: var(--ink); }
.dtab.on .lbl { font-weight: 700; }
.dtab.on { box-shadow: inset 0 -1px 0 var(--ink); }
.dtab .x { background: none; border: 0; width: 22px; padding: 0 8px 0 4px; color: var(--ink-2); font-size: 14px; line-height: 1; opacity: 0; border-radius: 0; }
.dtab:hover .x, .dtab.on .x { opacity: 1; }
.dtab .x:hover { color: var(--accent); }
.dstrip .count { font-size: var(--fs-xs); border: 1px solid currentColor; padding: 1px 5px; font-weight: 400; font-variant-numeric: tabular-nums; }
.dstrip .count.bad { color: var(--accent); }
.tabact { background: none; border: 0; border-left: 1px solid var(--hair); padding: 0 12px; font-size: var(--fs-s); color: var(--ink-2); white-space: nowrap; flex: none; }
.tabact:hover { color: var(--ink); }
.tabact.plus { border-left: 0; font-size: 17px; padding: 0 10px; }
.tilebody { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; position: relative; overflow: hidden; container: tile / inline-size; }
.view { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; }
body.dragging-view, body.dragging-view * { cursor: grabbing !important; user-select: none; }
body.resizing-x, body.resizing-x * { cursor: col-resize !important; user-select: none; }
body.resizing-y, body.resizing-y * { cursor: row-resize !important; user-select: none; }
.drop-hint { position: fixed; z-index: 60; pointer-events: none; background: var(--sel); border: 2px solid var(--accent); display: grid; place-items: center; transition: left .08s, top .08s, width .08s, height .08s; }
.drop-hint span { background: var(--bg); border: 1px solid var(--accent); color: var(--accent); padding: 3px 9px; font-size: var(--fs-xs); white-space: nowrap; }
.drop-hint.marker { background: var(--accent); border: 0; transition: none; }
.drag-ghost { position: fixed; z-index: 61; pointer-events: none; background: var(--ink); color: var(--bg); padding: 4px 10px; font-weight: 700; font-size: var(--fs-s); white-space: nowrap; }
.drag-ghost small { font-weight: 400; opacity: .75; font-size: var(--fs-xs); }
.picker { flex: 1; overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.picker .lead { margin: 0; color: var(--ink-2); }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; width: 100%; }
.pgrid button { background: none; border: 1px solid var(--hair); text-align: left; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; border-radius: 0; min-height: 60px; }
.pgrid button:hover { border-color: var(--ink); }
.pgrid b { font-size: var(--fs-m); } .pgrid small { color: var(--ink-2); font-size: var(--fs-xs); }

/* shared panels */
.toolbar { flex: none; min-height: 44px; border-bottom: 1px solid var(--hair); display: flex; align-items: center; gap: 8px; padding: 6px 12px; flex-wrap: wrap; }
.toolbar .lbl { color: var(--ink-2); font-size: var(--fs-xs); white-space: nowrap; }
.toolbar select, .fsel { height: 28px; border: 1px solid var(--hair); background: var(--bg); padding: 0 6px; font-size: var(--fs-s); border-radius: 0; }
.scroll { overflow: auto; overscroll-behavior: contain; flex: 1; min-height: 0; }
.tabbody { flex: 1; min-height: 0; display: flex; position: relative; }
.side { width: 272px; flex: none; border-left: 1px solid var(--hair); display: flex; flex-direction: column; min-height: 0; overflow-y: auto; background: var(--bg); }
.block { padding: 12px 14px 14px; border-bottom: 1px solid var(--hair); display: flex; flex-direction: column; gap: 8px; }
.block > header { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.block > header h2 { margin: 0; font: 700 var(--fs-m)/1.2 var(--display); }
.block > header .sub { color: var(--ink-2); font-size: var(--fs-xs); }
.note { color: var(--ink-2); font-size: var(--fs-xs); margin: 0; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; font-variant-numeric: tabular-nums; margin: 0; }
.kv dt { color: var(--ink-2); font-size: var(--fs-xs); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .kv dd { margin: 0; font-weight: 700; text-align: right; white-space: nowrap; }
.kv dd.ch { animation: chg .4s steps(2); }
@keyframes chg { 0% { color: var(--accent); } }
.rt { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.rt th { text-align: left; font-size: var(--fs-xs); color: var(--ink-2); font-weight: 400; padding: 3px 6px 3px 0; border-bottom: 1px solid var(--hair); white-space: nowrap; }
.rt td { padding: 4px 6px 4px 0; border-bottom: 1px solid var(--rule); }
.rt .num { text-align: right; }
.rt tr.sel td { font-weight: 700; }
.rt .bad { color: var(--accent); font-weight: 700; }
.meter { height: 8px; border: 1px solid var(--hair); position: relative; } .meter i { position: absolute; top: 0; bottom: 0; left: 0; background: var(--ink); }
.meter.bad { border-color: var(--accent); } .meter.bad i { background: var(--accent); }
.meter .pk { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--ink-2); }
.bignum { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.bignum b { font: 700 26px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; white-space: nowrap; }
.bignum b small { font-size: 12px; font-weight: 400; color: var(--ink-2); letter-spacing: 0; }
.bignum span { color: var(--ink-2); font-size: var(--fs-xs); }
.bignum.bad b { color: var(--accent); }
.empty { color: var(--ink-2); margin: 0; padding: 14px 16px; }
.src { margin: 0; padding: 8px 10px; font: 400 10.5px/1.5 var(--code); white-space: pre-wrap; word-break: break-word; color: var(--ink); max-height: 260px; overflow: auto; border: 1px solid var(--hair); background: var(--code-bg); }
.warn-row { border: 1px solid var(--accent); color: var(--accent); padding: 6px 8px; font-size: var(--fs-xs); white-space: pre-wrap; }
.ok-row { border: 1px solid var(--hair); padding: 6px 8px; font-size: var(--fs-xs); color: var(--ink-2); }

/* editor */
.ed { position: relative; flex: 1; min-height: 80px; display: flex; background: var(--code-bg); overflow: hidden; }
.egutter { width: 46px; flex: none; overflow: hidden; border-right: 1px solid var(--hair); color: var(--tok-com); text-align: right; position: relative; }
.gutter-in { padding: 10px 8px 60px 0; font: 400 12px/18px var(--code); will-change: transform; }
.gutter-in > div { height: 18px; white-space: nowrap; }
.gutter-in div.err { color: var(--accent); font-weight: 700; }
.gutter-in div.warn { color: var(--ink); font-weight: 700; }
.gutter-in div.hl { color: var(--ink); }
.code { position: relative; flex: 1; min-width: 0; overflow: hidden; }
.code pre, .code textarea { position: absolute; inset: 0; margin: 0; padding: 10px 14px 60px 12px; font: 400 12px/18px var(--code); white-space: pre; tab-size: 2; border: 0; letter-spacing: 0; }
.code pre { pointer-events: none; color: var(--ink); overflow: visible; will-change: transform; }
.code pre > div { min-height: 18px; }
.code textarea { background: transparent; color: transparent; caret-color: var(--accent); resize: none; overflow: auto; outline: none; -webkit-text-fill-color: transparent; border-radius: 0; }
.code textarea::selection { background: var(--sel); -webkit-text-fill-color: transparent; }
.tk-k { color: var(--tok-key); font-weight: 700; } .tk-s { color: var(--tok-str); } .tk-n { color: var(--tok-num); } .tk-e { color: var(--tok-expr); font-weight: 700; }
.tk-c { color: var(--tok-com); font-style: italic; } .tk-p { color: var(--tok-punc); } .tk-b { color: var(--tok-num); font-weight: 700; } .tk-m { color: var(--ink); }
.px0, .px1, .px2, .px3 { border-radius: 0; }
.px0 { background: var(--p0); color: var(--p2); } .px1 { background: var(--p1); color: var(--p3); }
.px2 { background: var(--p2); color: var(--p0); } .px3 { background: var(--p3); color: var(--p1); }
.pxd { color: var(--tok-com); }
.ln-err { background: var(--sel); box-shadow: inset 2px 0 0 var(--accent); }
.ln-warn { background: var(--fill); }
.ln-hl { background: var(--fill); box-shadow: inset 2px 0 0 var(--ink); }
.ed-foot { border-top: 1px solid var(--hair); padding: 6px 12px; display: flex; gap: 10px; align-items: center; min-height: 34px; font-size: var(--fs-xs); color: var(--ink-2); flex-wrap: wrap; flex: none; }
.ed-foot b { color: var(--ink); font-weight: 700; }
.ed-foot .bad { color: var(--accent); font-weight: 700; }
.diags { border-top: 1px solid var(--accent); display: flex; flex-direction: column; flex: none; max-height: 150px; overflow: auto; }
.diags.quiet { border-top-color: var(--hair); }
.diag { background: none; border: 0; border-bottom: 1px solid var(--rule); text-align: left; padding: 5px 12px; display: grid; grid-template-columns: 12px 34px 1fr; gap: 6px; align-items: baseline; font-size: var(--fs-xs); color: var(--ink); width: 100%; }
.diag:hover { background: var(--fill); }
.diag b { color: var(--ink-2); }
.diag .ln { color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.diag .m { white-space: pre-wrap; }
.diag.error b, .diag.error .ln { color: var(--accent); }
.diag.error .m { color: var(--accent); }
.diag.info .m { color: var(--ink-2); }

/* params & custom sliders */
.paramlist { flex: 1; min-height: 0; overflow: auto; }
.psub { position: sticky; top: 0; background: var(--bg); z-index: 1; padding: 8px 16px 4px; font-size: var(--fs-xs); color: var(--ink-2); border-bottom: 1px solid var(--rule); display: flex; gap: 8px; align-items: baseline; text-transform: uppercase; letter-spacing: .06em; }
.psub span { text-transform: none; letter-spacing: 0; }
.prow { display: grid; grid-template-columns: minmax(84px, 30%) minmax(0, 1fr) 72px 24px; gap: 4px 12px; align-items: center; font-size: var(--fs-xs); color: var(--ink-2); min-height: 44px; padding: 4px 16px; border-bottom: 1px solid var(--rule); }
.prow.hl { box-shadow: inset 2px 0 0 var(--accent); background: var(--fill); }
.prow .pn { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.prow .pn b { color: var(--ink); font-weight: 700; font-size: var(--fs-s); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .pn small { color: var(--ink-2); font-size: var(--fs-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .pc { min-width: 0; display: flex; align-items: center; }
.prow .pv { color: var(--ink); font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: var(--fs-s); }
.prow .pv small { font-weight: 400; color: var(--ink-2); font-size: var(--fs-xs); margin-left: 2px; }
.prow .pv.dirty::after { content: "•"; color: var(--accent); margin-left: 3px; }
.prow .wb { background: none; border: 1px solid transparent; color: var(--ink-2); height: 24px; width: 24px; padding: 0; font-size: 13px; }
.prow .wb:hover:not(:disabled) { border-color: var(--hair); color: var(--ink); }
.prow .wb:disabled { opacity: .25; cursor: default; }
.fs { position: relative; flex: 1; height: 26px; touch-action: none; cursor: ew-resize; outline: none; min-width: 60px; }
.fs .tr { position: absolute; left: 0; right: 0; top: 12px; height: 1px; background: var(--hair); }
.fs .fl { position: absolute; left: 0; top: 11px; height: 3px; background: var(--ink); }
.fs .tk { position: absolute; top: 17px; width: 1px; height: 4px; background: var(--hair); }
.fs .tk.mj { height: 6px; background: var(--ink-2); }
.fs .df { position: absolute; top: 4px; width: 1px; height: 6px; background: var(--ink-2); margin-left: 0; }
.fs .df::after { content: ""; position: absolute; left: -2px; top: -3px; width: 5px; height: 1px; background: var(--ink-2); }
.fs .th { position: absolute; top: 5px; width: 9px; height: 15px; margin-left: -4.5px; background: var(--bg); border: 1px solid var(--ink); }
.fs .th::after { content: ""; position: absolute; left: 3px; top: 3px; width: 1px; height: 7px; background: var(--ink); }
.fs:hover .th, .fs.drag .th { background: var(--ink); }
.fs:hover .th::after, .fs.drag .th::after { background: var(--bg); }
.fs:focus-visible .th { outline: 2px solid var(--accent); outline-offset: 1px; }
.fs.drag .fl { background: var(--accent); }
.fs .bub { position: absolute; top: -18px; transform: translateX(-50%); background: var(--ink); color: var(--bg); font: 700 10px/1 var(--mono); padding: 3px 5px; white-space: nowrap; pointer-events: none; display: none; font-variant-numeric: tabular-nums; }
.fs.drag .bub { display: block; }
.fs.sm { height: 22px; min-width: 70px; }
.fs.sm .tr { top: 10px; } .fs.sm .fl { top: 9px; } .fs.sm .th { top: 4px; height: 13px; width: 8px; margin-left: -4px; } .fs.sm .th::after { left: 2.5px; height: 5px; } .fs.sm .tk { top: 14px; }

/* stage */
.stagewrap { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--st-bg); display: grid; place-items: center; outline: none;
  background-image: linear-gradient(var(--rule) 1px, transparent 1px), linear-gradient(90deg, var(--rule) 1px, transparent 1px); background-size: 24px 24px; background-position: -1px -1px; }
.stage:focus-visible { box-shadow: inset 0 0 0 2px var(--st-ink); }
.bezel { background: var(--scr-bezel); padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 6px; position: relative; }
.bezel .scr { position: relative; line-height: 0; }
.bezel canvas.screen { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
.bezel canvas.ovl { position: absolute; left: 0; top: 0; pointer-events: none; }
.bezel .cap { font: 500 9px/1 var(--plex); color: #8c8c8c; letter-spacing: .14em; text-transform: uppercase; display: flex; justify-content: space-between; gap: 12px; overflow: hidden; white-space: nowrap; }
.bezel .cap > span { overflow: hidden; text-overflow: ellipsis; }
.bezel .cap .led { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #3a3a3a; margin-right: 6px; vertical-align: 0; }
.bezel .cap .led.on { background: #e2001a; box-shadow: 0 0 6px #e2001a; }
.chip-row { position: absolute; left: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; max-width: calc(100% - 24px); z-index: 2; }
.chip { font: 600 10px/1 var(--plex); letter-spacing: .08em; border: 1px solid var(--st-ink); background: var(--st-bg); color: var(--st-ink); padding: 5px 8px; text-transform: uppercase; }
.chip.on { background: var(--st-ink); color: var(--st-bg); }
.chip.ghost { border-color: var(--st-major); color: var(--st-muted); }
.chip.rec { border-color: var(--accent); color: var(--accent); }
.tricktoast { position: absolute; right: 12px; top: 12px; background: var(--st-bg); border: 1px solid var(--st-ink); padding: 8px 12px 7px; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; pointer-events: none; animation: tt 1.6s ease forwards; max-width: calc(100% - 24px); z-index: 3; }
.tricktoast b { font: 700 22px/1 var(--display); letter-spacing: -0.01em; text-transform: uppercase; color: var(--st-ink); white-space: nowrap; }
.tricktoast span { font: 400 10.5px/1.3 var(--plex); color: var(--st-muted); white-space: nowrap; }
@keyframes tt { 0% { opacity: 0; transform: translateY(-6px); } 8% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; } }
.failbanner { position: absolute; left: 12px; right: 12px; bottom: 12px; background: var(--accent); color: #fff; border: 0; padding: 7px 12px; text-align: left; font-size: var(--fs-s); cursor: pointer; z-index: 4; white-space: pre-wrap; max-height: 40%; overflow: auto; }
.failbanner b { font-weight: 700; }
.buildbanner { position: absolute; left: 12px; right: 12px; bottom: 12px; border: 1px solid var(--accent); background: var(--st-bg); color: var(--accent); padding: 6px 10px; font-size: var(--fs-xs); z-index: 2; cursor: pointer; text-align: left; }
.hint { flex: none; min-height: 30px; border-top: 1px solid var(--hair); display: flex; align-items: center; gap: 12px; padding: 0 14px; font-size: var(--fs-xs); color: var(--ink-2); white-space: nowrap; overflow: hidden; }
.hint b { color: var(--ink); font-weight: 700; }
.navx { display: grid; grid-template-columns: repeat(3, 34px); grid-template-rows: repeat(3, 30px); gap: 3px; }
.keyb { border: 1px solid var(--ink); background: none; user-select: none; -webkit-user-select: none; touch-action: none; border-radius: 0; display: inline-flex; align-items: center; justify-content: center; font-size: var(--fs-xs); padding: 0; height: 30px; }
.keyb.down, .keyb:active { background: var(--ink); color: var(--bg); }
.keyb.round { border-radius: 50%; width: 36px; height: 36px; font-weight: 700; }
.keyb.pillk { border-radius: 10px; height: 18px; width: 52px; font-size: 9px; letter-spacing: .06em; }
.padrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.abx { display: flex; gap: 8px; transform: rotate(-20deg); }
.ssrow { display: flex; gap: 8px; justify-content: center; }
.side .block.compact { gap: 6px; }

/* graph */
.graphwrap { flex: 1; min-height: 0; display: flex; }
.diagram { flex: 1; min-width: 0; overflow: auto; background: var(--st-bg); position: relative; }
.diagram svg { display: block; }
.graph text { font-family: var(--mono); fill: var(--ink); }
.graph .colhd { font-size: 10px; fill: var(--ink-2); letter-spacing: .06em; text-transform: uppercase; }
.graph .colrule { stroke: var(--rule); }
.graph .node { cursor: pointer; }
.graph .node rect.b { fill: var(--bg); stroke: var(--ink); stroke-width: 1; }
.graph .node .corner { stroke: var(--ink); stroke-width: 2; fill: none; }
.graph .node .nl { font-size: 11.5px; font-weight: 700; }
.graph .node .ns { font-size: 9.5px; fill: var(--ink-2); }
.graph .node .kd { font-size: 8.5px; fill: var(--ink-2); letter-spacing: .08em; text-transform: uppercase; }
.graph .node.k-bake rect.b, .graph .node.k-param rect.b { fill: var(--fill); stroke-dasharray: 3 2; }
.graph .node.k-event rect.b { fill: var(--fill); stroke: var(--ink-2); }
.graph .node.k-fragment rect.b { stroke-dasharray: 1 2; }
.graph .node.k-output rect.b { stroke-width: 2; }
.graph .node.k-instances rect.b { fill: var(--fill); }
.graph .node.k-bot rect.b { stroke: var(--accent); }
.graph .node:hover rect.b { stroke-width: 2; }
.graph .node.sel rect.b { stroke: var(--accent); stroke-width: 2; }
.graph .node.dim { opacity: .35; }
.graph .edge path { fill: none; stroke: var(--ink-2); stroke-width: 1; }
.graph .edge.dash path { stroke-dasharray: 4 3; }
.graph .edge.dot path { stroke-dasharray: 1 3; stroke-width: 1.5; }
.graph .edge.sel path { stroke: var(--accent); stroke-width: 1.6; }
.graph .edge.dim { opacity: .18; }
.graph .edge .ah { fill: var(--ink-2); }
.graph .edge.sel .ah { fill: var(--accent); }
.graph .elabel rect { fill: var(--st-bg); }
.graph .elabel text { font-size: 9px; fill: var(--ink-2); text-anchor: middle; }
.graph .edge.sel .elabel text { fill: var(--accent); font-weight: 700; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: var(--fs-xs); color: var(--ink-2); align-items: center; }
.legend i { display: inline-block; width: 18px; height: 10px; border: 1px solid var(--ink); vertical-align: -1px; margin-right: 5px; }
.legend i.d { border-style: dashed; background: var(--fill); } .legend i.e { background: var(--fill); border-color: var(--ink-2); } .legend i.o { border-width: 2px; }
.legend s { display: inline-block; width: 20px; border-top: 1px solid var(--ink-2); vertical-align: 3px; margin-right: 5px; text-decoration: none; }
.legend s.dash { border-top-style: dashed; } .legend s.dot { border-top: 2px dotted var(--ink-2); }
.refs { display: flex; flex-direction: column; gap: 2px; }
.nid { background: none; border: 0; padding: 0; font: inherit; color: var(--ink); text-decoration: underline; text-decoration-color: var(--hair); text-underline-offset: 2px; cursor: pointer; text-align: left; }
.nid:hover { text-decoration-color: var(--ink); }
.nid.on { color: var(--accent); font-weight: 700; text-decoration-color: var(--accent); }

/* IR / C text */
.irtext { margin: 0; padding: 10px 14px 40px; font: 400 11.5px/1.6 var(--code); white-space: pre; color: var(--ink); tab-size: 4; min-width: max-content; }
.irtext > div { min-height: 1.6em; }
.irtext .cm { color: var(--tok-com); }
.irtext .hd { color: var(--ink-2); font-weight: 700; }
.irtext .kw { font-weight: 700; }
.irtext .k { color: var(--tok-expr); }
.irtext .num { color: var(--ink); font-weight: 700; }
.irtext .hl { background: var(--fill); box-shadow: inset 2px 0 0 var(--accent); }
.irtext .st { color: var(--tok-str); }

/* events */
.evlist { flex: 1; min-height: 0; overflow: auto; font: 400 11.5px/1.55 var(--code); padding: 4px 0; }
.ev { display: grid; grid-template-columns: 64px 64px minmax(0, 1fr); gap: 10px; padding: 1px 12px; white-space: nowrap; }
.ev > span { overflow: hidden; text-overflow: ellipsis; }
.ev .t { color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }
.ev .kd { color: var(--ink-2); }
.ev:hover { background: var(--fill); }
.ev.warn .kd, .ev.warn .what, .ev.error .kd, .ev.error .what { color: var(--accent); }
.ev.event .what b { font-weight: 700; }
.repl { border-top: 1px solid var(--ink); padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 6px; flex: none; }
.repl-log { max-height: 130px; overflow: auto; font: 400 11px/1.45 var(--code); }
.repl-log pre { margin: 0 0 3px; white-space: pre-wrap; color: var(--ink-2); }
.repl-log pre.in { color: var(--ink); }
.repl-log pre.bad { color: var(--accent); }
.replin { display: flex; gap: 6px; align-items: center; }
.replin .pr { color: var(--ink-2); font: 400 11px var(--code); }
.replin input { flex: 1; min-width: 0; border: 1px solid var(--hair); background: var(--code-bg); padding: 4px 6px; font: 400 11px/1.45 var(--code); border-radius: 0; outline: none; }
.replin input:focus { border-color: var(--ink); }

/* budget, tiles */
.perfhead { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 14px 18px; padding: 14px 16px 12px; border-bottom: 1px solid var(--hair); }
.perfhead .bignum { gap: 5px; }
.hist { display: flex; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--hair); align-items: flex-start; flex-wrap: wrap; }
.hist canvas { border: 1px solid var(--hair); display: block; image-rendering: pixelated; }
.hist .note { max-width: 260px; }
.tilegrid { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px 16px; }
.tcell { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; background: none; border: 1px solid transparent; padding: 4px; text-align: left; border-radius: 0; }
.tcell:hover { border-color: var(--hair); }
.tcell.sel { border-color: var(--accent); }
.tcell canvas { display: block; image-rendering: pixelated; border: 1px solid var(--hair); }
.tcell small { font-size: var(--fs-xs); color: var(--ink-2); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tcell b { font-size: var(--fs-xs); }
.sect { padding: 10px 16px 0; font-size: var(--fs-xs); color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; display: flex; gap: 8px; align-items: baseline; }
.sect span { text-transform: none; letter-spacing: 0; }

/* agent */
.agentbody { padding: 12px 16px 30px; display: flex; flex-direction: column; gap: 14px; }
.ctlgrid { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.ctlgrid label { display: inline-flex; gap: 6px; align-items: center; font-size: var(--fs-xs); color: var(--ink-2); }
.ctlgrid input[type=number] { width: 70px; height: 28px; border: 1px solid var(--hair); background: var(--bg); padding: 0 6px; border-radius: 0; font-variant-numeric: tabular-nums; }
.reshd { display: flex; gap: 10px; align-items: baseline; padding-top: 12px; border-top: 2px solid var(--ink); }
.reshd h2 { margin: 0; font: 700 var(--fs-m)/1.2 var(--display); }
.reshd .sub { color: var(--ink-2); font-size: var(--fs-xs); }
.chart text { font-family: var(--mono); font-size: 9.5px; fill: var(--ink-2); }
.chart .ax { stroke: var(--hair); } .chart .gl { stroke: var(--rule); }
.chart .ln { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.chart .wh { stroke: var(--ink-2); }
.chart .pt { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.chart .pt.best { fill: var(--accent); stroke: var(--accent); }
.chart .cur { stroke: var(--accent); stroke-dasharray: 3 3; }
.spark { display: block; }
.spark .bar { fill: var(--ink); } .spark .bar.lo { fill: var(--ink-2); }

/* docs */
.doc { max-width: 76ch; padding: 18px 22px 64px; font: 400 13.5px/1.65 var(--mono); color: var(--ink); overflow-wrap: break-word; }
.doc h1 { font: 700 22px/1.2 var(--display); margin: 0 0 10px; letter-spacing: -0.01em; }
.doc h2 { font: 700 16px/1.3 var(--display); margin: 28px 0 8px; padding-top: 12px; border-top: 1px solid var(--ink); }
.doc h3 { font: 700 13.5px/1.35 var(--display); margin: 20px 0 4px; }
.doc h4 { font: 700 11px/1.35 var(--display); margin: 14px 0 2px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
.doc p { margin: 0 0 10px; }
.doc ul, .doc ol { margin: 0 0 10px; padding-left: 22px; }
.doc li { margin: 3px 0; }
.doc code { font: 400 .9em var(--code); background: var(--fill); padding: 1px 4px; }
.doc pre.src { max-height: none; margin: 6px 0 14px; font-size: 11.5px; white-space: pre; overflow-x: auto; word-break: normal; }
.doc .lead { color: var(--ink-2); }
.doc table { border-collapse: collapse; width: 100%; margin: 6px 0 14px; font-size: 12.5px; }
.doc td, .doc th { border-bottom: 1px solid var(--rule); padding: 4px 8px 4px 0; text-align: left; vertical-align: top; }
.doc th { color: var(--ink-2); font-weight: 400; font-size: var(--fs-xs); border-bottom-color: var(--hair); }
.doc .meta { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
.doc .callout { border-left: 2px solid var(--ink); padding: 6px 10px; margin: 6px 0 12px; background: var(--fill); }
.doc kbd { font-size: 11px; }

@container tile (max-width: 620px) {
  .tabbody:not(.col) { flex-direction: column; overflow-y: auto; }
  .tabbody:not(.col) > .stagewrap { min-height: 360px; flex: 1 0 auto; }
  .tabbody:not(.col) > .side { width: auto; border-left: 0; border-top: 1px solid var(--hair); overflow: visible; flex: none; }
  .graphwrap { flex-direction: column; } .graphwrap > .side { width: auto; border-left: 0; border-top: 1px solid var(--hair); max-height: 40%; }
  .prow { grid-template-columns: minmax(70px, 34%) minmax(0, 1fr) 60px 22px; padding: 4px 10px; gap: 4px 8px; }
}
@media (max-width: 1100px) { .bar .pill span, .brand i { display: none; } }
@media (max-width: 860px) { .bar .pill.score, .runctl select { display: none; } .projbtn { max-width: 200px; } }
@media (max-width: 640px) {
  .bar { gap: 6px; padding-left: 10px; } .brand { padding-right: 8px; font-size: 13px; } .brand .bt { display: none; }
  .bar .pill, .bar .hidesm { display: none; } .runctl .clock { min-width: 0; }
  .menu.presets { min-width: 0; width: min(400px, calc(100vw - 16px)); position: fixed; left: 8px; top: 56px; }
}

/* agent (from the Form Skate Workbench) */
.agent-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.threads { display: flex; align-items: stretch; border-bottom: 1px solid var(--hair); flex: none; overflow-x: auto; scrollbar-width: none; }
.threads .th { display: inline-flex; align-items: stretch; border-right: 1px solid var(--hair); flex: none; }
.threads button { background: none; border: 0; padding: 7px 12px; font-size: var(--fs-xs); color: var(--ink-2); white-space: nowrap; border-radius: 0; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.threads .th.on button { color: var(--ink); font-weight: 700; }
.threads .th.on { box-shadow: inset 0 -2px 0 var(--ink); }
.threads .th .x { padding: 7px 8px 7px 0; font-size: 14px; line-height: 1; }
.threads .th .x:hover { color: var(--accent); }
.threads .new { margin-left: auto; color: var(--ink); flex: none; position: sticky; right: 0; background: var(--bg); border-left: 1px solid var(--hair); }
.threads button:disabled { opacity: .4; cursor: default; }
.agent-set { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; padding: 7px 16px; border-bottom: 1px solid var(--rule); flex: none; }
.ctl-l { font-size: var(--fs-xs); color: var(--ink-2); }
.agent-off { margin: 10px 16px 0; border: 1px solid var(--ink); padding: 8px 10px; font-size: var(--fs-s); flex: none; }
.agent-off b { display: block; }
.agent-log { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }
.agent-log > * { flex-shrink: 0; }
.agent-empty p { margin: 0 0 10px; color: var(--ink-2); max-width: 560px; }
.sugg { display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
.sugg button { background: none; border: 1px solid var(--hair); padding: 5px 10px; text-align: left; font-size: var(--fs-s); border-radius: 0; max-width: 100%; }
.sugg button:hover { border-color: var(--ink); }
.msg { display: flex; flex-direction: column; gap: 4px; max-width: 100%; }
.msg > * { flex-shrink: 0; }
.msg .who { font-size: var(--fs-xs); color: var(--ink-2); }
.msg.user .body { border: 1px solid var(--ink); padding: 8px 10px; white-space: pre-wrap; align-self: flex-start; max-width: 92%; }
.msg.agent.error .who, .msg .note { color: var(--accent); }
.msg .note { font-size: var(--fs-xs); }
.md { font-size: var(--fs-s); line-height: 1.5; overflow-wrap: anywhere; }
.md p { margin: 0 0 6px; } .md p:last-child { margin-bottom: 0; }
.md .mh { font-weight: 700; margin-top: 8px; }
.md ul, .md ol { margin: 0 0 6px; padding-left: 18px; } .md li { margin: 1px 0; }
.md code { background: var(--fill); padding: 0 3px; font: 400 .92em var(--code); }
.md a { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
.md a.lablink { text-decoration-color: var(--accent); }
.md a.lablink::after { content: " ▸"; font-size: .8em; color: var(--accent); }
.md pre.src { color: var(--ink); max-height: 260px; margin: 4px 0 6px; white-space: pre; overflow-x: auto; }
.thinking { color: var(--ink-2); font-size: var(--fs-xs); }
.thinking::after { content: ""; display: inline-block; width: 6px; height: 6px; margin-left: 6px; background: var(--ink-2); animation: bl .8s steps(2) infinite; }
@keyframes bl { 50% { opacity: 0; } }
.res { margin: 0; font: 400 10.5px/1.5 var(--code); white-space: pre-wrap; word-break: break-word; border-left: 2px solid var(--hair); padding: 2px 0 2px 8px; color: var(--ink); max-height: 260px; overflow: auto; }
.res.bad { border-color: var(--accent); color: var(--accent); }
details.tool { border: 1px solid var(--hair); margin: 2px 0; }
details.tool > summary { list-style: none; display: grid; grid-template-columns: 8px auto minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 4px 8px; cursor: pointer; font-size: var(--fs-xs); }
details.tool > summary::-webkit-details-marker { display: none; }
details.tool .dot { width: 7px; height: 7px; background: var(--ink); }
details.tool.run .dot { animation: bl .8s steps(2) infinite; }
details.tool.ask { border-color: var(--accent); }
details.tool.ask .dot { background: var(--accent); animation: bl .8s steps(2) infinite; }
details.tool.err, details.tool.err .dot { border-color: var(--accent); } details.tool.err .dot { background: var(--accent); }
details.tool.reverted { opacity: .55; } details.tool.reverted .first { text-decoration: line-through; }
details.tool .nm { font-weight: 700; }
details.tool .first { font: 400 10.5px/1.4 var(--code); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
details.tool .ms { color: var(--ink-2); white-space: nowrap; }
details.tool.ask .ms { color: var(--accent); font-weight: 700; }
details.tool .tb { border-top: 1px solid var(--rule); padding: 6px 8px 8px; display: flex; flex-direction: column; gap: 6px; }
details.tool .tb > pre.src { max-height: 280px; white-space: pre; overflow: auto; }
details.tool .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.composer { border-top: 1px solid var(--hair); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; flex: none; }
.composer textarea { width: 100%; min-height: 54px; max-height: 160px; resize: vertical; border: 1px solid var(--hair); background: var(--code-bg); padding: 8px; outline: none; border-radius: 0; font: 400 var(--fs-s)/1.45 var(--mono); }
.composer textarea:focus { border-color: var(--ink); }
.composer .row { display: flex; gap: 8px; align-items: center; }
.composer .meta { flex: 1; font-size: var(--fs-xs); color: var(--ink-2); }

.boot-screen { flex: 1; display: grid; place-items: center; color: var(--ink-2); }
.boot-screen p { border-left: 2px solid var(--ink); padding: 4px 12px; }
</style>

<script>window.DMG_PRESETS = [{"id":"01","group":"Learn the grammar","title":"Smallest build","sub":"Game, the DMG screen, one HUD lambda","code":"// The smallest build: a Game, the DMG screen, and one runtime lambda (the HUD).\n// Every chain ends in .build(), which compiles the builders into an IR.\n\nGame(\"hello\")\n  .screen(160, 144)            // the only size the DMG has; try 160, 140\n  .palette(\"dmg\")              // display hint: dmg, pocket, kiln, backlit\n  .hud((w, at) => {\n    at(5, 7).text(\"HELLO DMG\");\n    at(4, 9).text(\"FRAME %05d\", w.frame);\n    at(3, 11).text(\"%02d:%02d SINCE BOOT\", w.frame / 3600, (w.frame / 60) % 60);\n  })\n  .build();\n","notes":"<h1>Smallest build<\/h1>\n<p>Every program is one fluent chain that ends in <code>.build()<\/code>. The chain only records what you asked for; <code>build()<\/code> checks it, folds what it can, and returns an IR that the stage runs and the C view prints.<\/p>\n<p>The HUD lambda runs every frame at runtime. It draws 8×8 font tiles into the window layer, so each glyph you use costs a tile in BG VRAM (see <b>Budget<\/b>).<\/p>\n<h3>Try<\/h3>\n<ul><li>Change <code>.screen(160, 144)<\/code> to <code>.screen(160, 140)<\/code>: the builder rejects it with the line marked in red.<\/li>\n<li>Misspell <code>.hud<\/code> as <code>.hdu<\/code>: the builder proxy suggests the right name.<\/li>\n<li>Switch the palette in the stage toolbar; the game's own palette is only a hint.<\/li><\/ul>"},{"id":"02","group":"Learn the grammar","title":"One sprite on a background","sub":"component, sprite, tiles, background","code":"// A component owns sprites. Background tiles belong to the Game.\n// The background lambda runs once, at build time, and becomes ROM data.\n\nconst Mole = component(\"Mole\")\n  .sprite(\"up\", art`\n    ................\n    .....333333.....\n    ...3322222233...\n    ..322222222223..\n    .32200222200223.\n    .32203222230223.\n    .32222211222223.\n    .32222111122223.\n    .32211122111223.\n    .32222200222223.\n    .32222222222223.\n    3322222222222233\n    3112222222222113\n    3332222222222333\n    ..322222222223..\n    ..322222222223..\n  `);\n\nGame(\"one-sprite\")\n  .screen(160, 144)\n  .tiles({\n    grass: art`\n      00000000\n      00010000\n      00000000\n      00000001\n      01000000\n      00000000\n      00001000\n      00000000\n    `,\n    hole: art`\n      0011111111111100\n      0133333333333310\n      1333333333333331\n      1333333333333331\n      1333333333333331\n      1333333333333331\n      0133333333333310\n      0011111111111100\n    `,\n  })\n  .background((bg) => {\n    bg.fill(\"grass\");\n    bg.set(9, 10, \"hole\");          // 16×8 art covers two cells\n    bg.text(4, 15, \"ONE MOLE\");\n  })\n  .place(Mole, { x: 72, y: 70 })\n  .build();\n","notes":"<h1>One sprite<\/h1>\n<p><code>art`…`<\/code> is a tagged template: <code>.<\/code> is transparent and <code>0<\/code>–<code>3<\/code> are the four DMG shades, lightest first. The editor tints those digits so you can see the picture while you type.<\/p>\n<p>The mole is 16×16. With the default 8×16 object mode that is two hardware objects. The hole is a 16×8 background image, cut into two 8×8 tiles; <code>bg.set<\/code> stamps both.<\/p>\n<h3>Try<\/h3>\n<ul><li>Open <b>Tiles<\/b> to see every 8×8 tile and its 2bpp bytes.<\/li>\n<li>Put an <code>x<\/code> in the art: the parser stops at that row.<\/li>\n<li>Drag the mole: change <code>x: 72<\/code> and watch the stage rebuild.<\/li><\/ul>"},{"id":"03","group":"Learn the grammar","title":"A 3×3 board","sub":"board, grid and a build-time position lambda","code":"// board(b => b.grid(rows, cols, Component, pos)) makes one entity per cell.\n// The position lambda runs at build time; the draw lambda runs every frame.\n\nconst cell = (r, c) => ({ cx: 3 + c * 6, cy: 6 + r * 4 });   // plain JS, shared by both lambdas\n\nconst Mole = component(\"Mole\")\n  .sprite(\"up\", art`\n    ................\n    .....333333.....\n    ...3322222233...\n    ..322222222223..\n    .32200222200223.\n    .32203222230223.\n    .32222211222223.\n    .32222111122223.\n    .32211122111223.\n    .32222200222223.\n    .32222222222223.\n    3322222222222233\n    3112222222222113\n    3332222222222333\n    ..322222222223..\n    ..322222222223..\n  `)\n  .draw((self, w) => ((w.frame >> 4) % 9 === self.index ? \"up\" : null));   // runtime\n\nGame(\"board\")\n  .screen(160, 144)\n  .tiles({\n    grass: art`\n      00000000\n      00010000\n      00000000\n      00000001\n      01000000\n      00000000\n      00001000\n      00000000\n    `,\n    hole: art`\n      0011111111111100\n      0133333333333310\n      1333333333333331\n      1333333333333331\n      1333333333333331\n      1333333333333331\n      0133333333333310\n      0011111111111100\n    `,\n  })\n  .background((bg) => {\n    bg.fill(\"grass\");\n    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) bg.set(cell(r, c).cx, cell(r, c).cy, \"hole\");\n  })\n  .board((b) =>\n    b.grid(3, 3, Mole, (r, c) => ({          // build time\n      x: cell(r, c).cx * 8,\n      y: cell(r, c).cy * 8 - 10,\n    }))\n  )\n  .hud((w, at) => at(1, 1).text(\"CELL %d\", (w.frame >> 4) % 9))\n  .build();\n","notes":"<h1>A 3×3 board<\/h1>\n<p>The grid's position lambda and the background lambda both call <code>cell()<\/code>, an ordinary JS function. They run once in the workbench, so their results are constants in the IR: open <b>IR<\/b> and look for the nine Mole instances with their x and y already filled in.<\/p>\n<p>The draw lambda is different: it reads <code>w.frame<\/code>, so it has to run on the device each frame. Returning <code>null<\/code> hides the sprite and frees its OAM slots.<\/p>\n<h3>Try<\/h3>\n<ul><li>Make it 4×4: change the grid and the loop, and move <code>cell<\/code> so it fits.<\/li>\n<li>Call <code>w.board.at(12)<\/code> in the HUD: the list proxy names the valid range.<\/li><\/ul>"},{"id":"04","group":"Learn the grammar","title":"Sliders","sub":"param: slider, toggle, choice; live and build-time","code":"// Params become sliders in the Params view. live: true values change while the\n// game runs; build-time values are folded into constants, so moving one rebuilds.\n\nconst Mole = component(\"Mole\")\n  .sprite(\"up\", art`\n    ................\n    .....333333.....\n    ...3322222233...\n    ..322222222223..\n    .32200222200223.\n    .32203222230223.\n    .32222211222223.\n    .32222111122223.\n    .32211122111223.\n    .32222200222223.\n    .32222222222223.\n    3322222222222233\n    3112222222222113\n    3332222222222333\n    ..322222222223..\n    ..322222222223..\n  `)\n  .attr(\"up\", { type: \"bool\" })\n  .attr(\"ttl\", { type: \"u16\" })\n  .onFrame((self) => {\n    if (self.up && --self.ttl === 0) self.up = false;\n  })\n  .draw((self) => (self.up ? \"up\" : null));\n\nGame(\"sliders\")\n  .screen(160, 144)\n  .param(\"spawn\", slider({ min: 150, max: 1500, step: 50, value: 600, label: \"Spawn every\", unit: \"ms\", live: true }))\n  .param(\"linger\", slider({ min: 0.5, max: 6, step: 0.5, value: 2, label: \"Mole stays\", unit: \"s\" }))\n  .param(\"order\", choice({ options: [\"random\", \"sweep\"], value: \"random\", label: \"Order\", live: true }))\n  .param(\"sound\", toggle({ value: true, label: \"Pop sound\", live: true }))\n  .tiles({\n    grass: art`\n      00000000\n      00010000\n      00000000\n      00000001\n      01000000\n      00000000\n      00001000\n      00000000\n    `,\n  })\n  .background((bg) => bg.fill(\"grass\"))\n  .board((b) => b.grid(3, 3, Mole, (r, c) => ({ x: 24 + c * 48, y: 36 + r * 34 })))\n  .attr(\"next\", { type: \"u8\" })\n  .sfx(\"pop\", { f: 520, to: 780, ms: 30 })\n  .timer(\"spawn\", { every: $.param(\"spawn\") }, (w) => {\n    const m = w.param(\"order\") === \"sweep\" ? w.board.at(w.next) : w.rng.pick(w.board.filter((m) => !m.up));\n    w.next = (w.next + 1) % 9;\n    if (!m) return;\n    m.up = true;\n    m.ttl = w.param(\"linger\") * 60;\n    if (w.param(\"sound\")) w.sfx(\"pop\");\n  })\n  .hud((w, at) => {\n    at(0, 0).text(\"EVERY %4dMS\", w.param(\"spawn\"));\n    at(0, 1).text(\"STAY  %d.%dS\", w.param(\"linger\"), (w.param(\"linger\") * 10) % 10);\n  })\n  .build();\n","notes":"<h1>Sliders<\/h1>\n<p><code>.param(name, slider({…}))<\/code> declares a knob. The Params view draws it; the IR records whether it is <b>live<\/b> (a WRAM variable, readable through <code>w.param()<\/code> while running) or <b>build<\/b> (a <code>#define<\/code>, folded wherever it is read).<\/p>\n<p>The timer's interval is <code>$.param(\"spawn\")<\/code>, a reference rather than a number. Because <i>spawn<\/i> is live, the timer keeps the reference and rereads it each time it fires. Point it at <i>linger<\/i> instead and the IR shows a folded constant.<\/p>\n<h3>Try<\/h3>\n<ul><li>Drag <b>spawn<\/b> while it runs: nothing restarts. Drag <b>linger<\/b>: the program rebuilds, and the C view's <code>#define LINGER<\/code> changes.<\/li>\n<li>Double-click a slider to reset it; the ↵ button writes the value back into the code.<\/li>\n<li>Set the slider's <code>value<\/code> outside its range in the code to see the RangeError.<\/li><\/ul>"},{"id":"05","group":"Learn the grammar","title":"Build-time and runtime lambdas","sub":"bake, method, onFrame, draw on one component","code":"// One component, lambdas at two times:\n//   bake    runs in the workbench, per instance, and its results become ROM constants\n//   method / onFrame / draw run on the device every frame\n\nconst MOLE = `\n  ................\n  .....333333.....\n  ...3322222233...\n  ..322222222223..\n  .32200222200223.\n  .32203222230223.\n  .32222211222223.\n  .32222111122223.\n  .32211122111223.\n  .32222200222223.\n  .32222222222223.\n  3322222222222233\n  3112222222222113\n  3332222222222333\n  ..322222222223..\n  ..322222222223..\n`;\nconst rows = MOLE.trim().split(\"\\n\");\n\nconst Mole = component(\"Mole\")\n  .sprite(\"up\", art(MOLE))\n  .sprite(\"peek\", art(rows.slice(0, 8).join(\"\\n\")))      // build-time JS on art\n  .attr(\"up\", { type: \"bool\" })\n  .attr(\"ttl\", { type: \"u16\" })\n  .attr(\"rise\", { type: \"u8\" })\n  .bake((self, ctx) => {\n    self.stay = ctx.param(\"linger\").value * 60;          // frames, a ROM constant\n    self.delay = (ctx.row + ctx.col) * 12;               // per instance: stagger by diagonal\n  })\n  .method(\"pop\", (self) => {\n    self.up = true;\n    self.ttl = self.stay;\n    self.rise = 8;\n  })\n  .onFrame((self, w) => {\n    if (self.rise) self.rise--;\n    if (self.up && --self.ttl === 0) self.up = false;\n    if (!self.up && (w.frame + self.delay) % 150 === 0) self.pop();\n  })\n  .draw((self) => {\n    if (!self.up) return null;\n    return self.rise > 4 ? { sprite: \"peek\", y: self.y + 8 } : \"up\";\n  });\n\nGame(\"lambdas\")\n  .screen(160, 144)\n  .param(\"linger\", slider({ min: 0.5, max: 2.5, step: 0.25, value: 1, label: \"Mole stays\", unit: \"s\" }))\n  .tiles({\n    grass: art`\n      00000000\n      00010000\n      00000000\n      00000001\n      01000000\n      00000000\n      00001000\n      00000000\n    `,\n    hole: art`\n      0011111111111100\n      0133333333333310\n      1333333333333331\n      1333333333333331\n      1333333333333331\n      1333333333333331\n      0133333333333310\n      0011111111111100\n    `,\n  })\n  .background((bg) => {\n    bg.fill(\"grass\");\n    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) bg.set(3 + c * 6, 6 + r * 4, \"hole\");\n  })\n  .board((b) => b.grid(3, 3, Mole, (r, c) => ({ x: (3 + c * 6) * 8, y: (6 + r * 4) * 8 - 10 })))\n  .hud((w, at) => at(0, 0).text(\"UP %d OF 9\", w.board.filter((m) => m.up).length))\n  .build();\n","notes":"<h1>Build-time and runtime lambdas<\/h1>\n<p><code>bake<\/code> runs once per instance, inside the workbench, with access to build-time params and the instance's row and column. Whatever it assigns to <code>self<\/code> that is not a declared attribute becomes a baked constant: read-only at runtime, and a ROM table in the C output (look for <code>Mole_delay[9]<\/code>).<\/p>\n<p><code>method<\/code>, <code>onFrame<\/code> and <code>draw<\/code> are runtime lambdas. They can read baked constants and change attributes, and they are what a backend would have to port.<\/p>\n<h3>Try<\/h3>\n<ul><li>In onFrame, write <code>self.stay = 5<\/code>: the entity proxy explains that baked values are ROM.<\/li>\n<li>Move <b>linger<\/b>: build-time, so the IR's baked <i>stay<\/i> changes on every mole.<\/li>\n<li>Open <b>Graph<\/b> and click <i>Mole.bake<\/i> to see what feeds it.<\/li><\/ul>"},{"id":"06","group":"Learn the grammar","title":"Fragments","sub":"reusable attrs, methods and frames, added with .with()","code":"// Fragments add attributes, methods, frame lambdas and HUD lines to a component\n// or to the Game itself. The same fragment can be reused across games.\n\nconst Scorable = fragment(\"Scorable\")\n  .attr(\"score\", { type: \"u16\", init: 0, max: 9999 })\n  .method(\"award\", (self, pts) => { self.score = self.score + pts; })\n  .hud((w, at) => at(0, 0).text(\"SCORE %04d\", w.score));\n\nconst Countdown = fragment(\"Countdown\")\n  .attr(\"secs\", { type: \"u8\", init: 40 })\n  .onFrame((w) => { if (w.frame % 60 === 59 && w.secs > 0) w.secs--; })\n  .hud((w, at) => at(13, 0).text(\"TIME %02d\", w.secs));\n\nconst Whackable = fragment(\"Whackable\")\n  .attr(\"up\", { type: \"bool\" })\n  .attr(\"ttl\", { type: \"u8\" })\n  .method(\"whack\", (self) => {\n    if (!self.up) return false;\n    self.up = false;\n    self.world.award(100);              // Scorable, attached to the world\n    return true;\n  })\n  .onFrame((self) => { if (self.up && --self.ttl === 0) self.up = false; });\n\nconst Mole = component(\"Mole\")\n  .with(Whackable)\n  .sprite(\"up\", art`\n    ................\n    .....333333.....\n    ...3322222233...\n    ..322222222223..\n    .32200222200223.\n    .32203222230223.\n    .32222211222223.\n    .32222111122223.\n    .32211122111223.\n    .32222200222223.\n    .32222222222223.\n    3322222222222233\n    3112222222222113\n    3332222222222333\n    ..322222222223..\n    ..322222222223..\n  `)\n  .draw((self) => (self.up ? \"up\" : null));\n\nconst Hammer = component(\"Hammer\")\n  .sprite(\"idle\", art`\n    ....33333333....\n    ...3222222223...\n    ...3211111123...\n    ...3211111123...\n    ...3222222223...\n    ....33333333....\n    ......3223......\n    ......3223......\n    ......3223......\n    ......3223......\n    ......3333......\n  `)\n  .attr(\"cell\", { type: \"u8\", init: 4 })\n  .onFrame((self, w) => {\n    const d = w.input.dpad();\n    self.cell = w.grid.step(self.cell, d.x, d.y);\n    if (w.input.pressed(\"A\")) w.emit(\"whack\", { cell: self.cell });\n  })\n  .draw((self, w) => ({ x: w.board.at(self.cell).x, y: w.board.at(self.cell).y - 8 }));\n\nGame(\"fragments\")\n  .screen(160, 144)\n  .with(Scorable, Countdown)\n  .tiles({\n    grass: art`\n      00000000\n      00010000\n      00000000\n      00000001\n      01000000\n      00000000\n      00001000\n      00000000\n    `,\n  })\n  .background((bg) => bg.fill(\"grass\"))\n  .place(Hammer)\n  .board((b) => b.grid(3, 3, Mole, (r, c) => ({ x: 24 + c * 48, y: 36 + r * 34 })))\n  .timer(\"spawn\", { every: 700 }, (w) => {\n    const m = w.rng.pick(w.board.filter((m) => !m.up));\n    if (m) { m.up = true; m.ttl = 90; }\n  })\n  .on(\"whack\", (w, e) => { if (w.board.at(e.cell).whack()) w.toast(\"WHACK\", \"+100\"); })\n  .done((w) => w.secs === 0)\n  .build();\n","notes":"<h1>Fragments<\/h1>\n<p>A fragment is a partial component: <code>attr<\/code>, <code>method<\/code>, <code>onFrame<\/code>, <code>init<\/code>, <code>on<\/code> and <code>hud<\/code>. <code>.with(F)<\/code> merges it in before the component's own definitions, so the component can override a fragment's method (the build reports it as info).<\/p>\n<p>On a Game, a fragment's attributes live in the world: <code>w.score<\/code>, <code>w.award(100)<\/code>. On a component they live on each instance: <code>self.up<\/code>, <code>mole.whack()<\/code>.<\/p>\n<p>Controls: d-pad moves, <kbd>X<\/kbd>/<kbd>K<\/kbd> is A.<\/p>\n<h3>Try<\/h3>\n<ul><li>Add <code>.with(Scorable)<\/code> to Mole as well: now every mole has its own <i>score<\/i> too. Check the struct in <b>C<\/b>.<\/li>\n<li>Give Mole its own <code>.method(\"whack\", …)<\/code>: the build notes that it overrides the fragment's.<\/li>\n<li>Pass Mole to <code>.with()<\/code>: the builder explains that with() takes fragments.<\/li><\/ul>"},{"id":"07","group":"Learn the grammar","title":"Pools and spawning","sub":"pool, spawn, destroy, fix-point physics","code":"// pool(name, Component, n) preallocates n entities, the way you would reserve OAM slots.\n// w.spawn(name, init) wakes a free one; self.destroy() returns it to the pool.\n\nconst Spark = component(\"Spark\")\n  .sprite(\"big\", art`\n    ...3....\n    ..323...\n    .32023..\n    3200023.\n    .32023..\n    ..323...\n    ...3....\n  `)\n  .sprite(\"small\", art`\n    ........\n    ........\n    ...3....\n    ..303...\n    ...3....\n  `)\n  .attr(\"vx\", { type: \"fix\" })              // 8.8 fixed point, like the real thing\n  .attr(\"vy\", { type: \"fix\" })\n  .attr(\"life\", { type: \"u8\" })\n  .onFrame((self, w) => {\n    self.vy += w.param(\"gravity\");\n    self.x += self.vx;\n    self.y += self.vy;\n    if (--self.life === 0 || self.y > 144) self.destroy();\n  })\n  .draw((self) => (self.life > 12 ? \"big\" : \"small\"));\n\nconst Cursor = component(\"Cursor\")\n  .sprite(\"cross\", art`\n    ...3....\n    ...3....\n    ...3....\n    333.333.\n    ...3....\n    ...3....\n    ...3....\n  `)\n  .onFrame((self, w) => {\n    const a = w.input.axis();\n    self.x = Math.max(0, Math.min(152, self.x + a.x * 2));\n    self.y = Math.max(16, Math.min(136, self.y + a.y * 2));\n    if (w.input.held(\"A\")) w.emit(\"burst\", { x: self.x, y: self.y });\n  });\n\nGame(\"pools\")\n  .screen(160, 144)\n  .param(\"burst\", slider({ min: 1, max: 6, value: 2, label: \"Sparks per frame\", live: true }))\n  .param(\"gravity\", slider({ min: 0, max: 0.4, step: 0.02, value: 0.12, label: \"Gravity\", live: true }))\n  .place(Cursor, { x: 76, y: 70 })\n  .pool(\"sparks\", Spark, 24)\n  .sfx(\"fizz\", { f: 1200, to: 300, ms: 40, wave: \"noise\", vol: 0.3 })\n  .on(\"burst\", (w, e) => {\n    for (let i = 0; i < w.param(\"burst\"); i++) {\n      const s = w.spawn(\"sparks\", { x: e.x, y: e.y });\n      if (!s) break;                                    // pool full\n      s.vx = (w.rand(64) - 32) / 16;\n      s.vy = -1 - w.rand(32) / 16;\n      s.life = 20 + w.rand(20);\n    }\n    if (w.frame % 6 === 0) w.sfx(\"fizz\");\n  })\n  .hud((w, at) => {\n    at(0, 0).text(\"HOLD A  ALIVE %02d/24\", w.pool(\"sparks\").length);\n  })\n  .build();\n","notes":"<h1>Pools and spawning<\/h1>\n<p>The DMG has 40 OAM slots and no allocator worth using, so dynamic things come from fixed pools. <code>w.spawn()<\/code> resets a dead entity's attributes, applies the init object, and runs its <code>init<\/code> lambdas; when every slot is busy it returns <code>null<\/code> and logs one warning.<\/p>\n<p><code>type: \"fix\"<\/code> stores 8.8 fixed point: fractions survive, but values wrap at ±128. Integer types drop fractions and say so.<\/p>\n<h3>Try<\/h3>\n<ul><li>Hold A with <b>Sparks per frame<\/b> at 6: the pool fills, then the <b>Budget<\/b> view's scanline histogram shows lines over 10 objects.<\/li>\n<li>Change <code>vx<\/code> to <code>type: \"i8\"<\/code>: the runtime warns once that fractions are lost.<\/li><\/ul>"},{"id":"08","group":"Learn the grammar","title":"Proxy diagnostics","sub":"what the builder, entity and world proxies catch","code":"// Each commented line is a mistake. Uncomment one at a time and read the\n// diagnostics under the editor (build errors) or on the stage (runtime).\n\nconst Mole = component(\"Mole\")\n  .sprite(\"up\", art`\n    ..333333........\n    .32222223.......\n    3220220223......\n    3222222223......\n    3221111223......\n    .32222223.......\n    ..333333........\n  `)\n  // .sprit(\"down\", art`33`)             // builder proxy: Did you mean 'sprite'?\n  .attr(\"ttl\", { type: \"u8\" })\n  .attr(\"taps\", { type: \"u8\" })\n  // .attr(\"speed\", { type: \"float\" })   // unknown type, with the list of types\n  .onFrame((self, w) => {\n    self.ttl = self.ttl + 7;              // u8 wraps past 255: one runtime warning\n    if (w.input.pressed(\"B\")) self.taps = self.taps + 0.5;   // fraction dropped: warning\n    // self.positon = 3;                  // entity proxy: no member 'positon'\n    // self.speed = 2;                    // cannot add attributes at runtime\n    // if (Math.random() < 0.1) self.ttl = 0;   // lint: not on the DMG, use w.rand\n  });\n\nGame(\"diagnostics\")\n  .screen(160, 144)\n  // .screen(160, 140)                    // the DMG screen is 160×144\n  .param(\"speed\", slider({ min: 1, max: 8, value: 4, label: \"Speed\" }))   // try value: 12\n  .place(Mole, { x: 64, y: 64 })\n  // .place(Mole, { x: 8, y: 8, hp: 3 })  // no attribute 'hp' to set at placement\n  .on(\"whack\", (w) => w.log(\"whacked\"))  // info: nothing emits 'whack'\n  .onFrame((w) => {\n    if (w.input.pressed(\"A\")) w.emit(\"wack\");   // warning: nobody handles 'wack' (did you mean whack?)\n    // w.board.at(3);                     // this game has no board\n    // w.input.pressed(\"C\");              // no button 'C'\n  })\n  .hud((w, at) => {\n    at(1, 1).text(\"TTL  %03d\", w.mole.ttl);\n    at(1, 2).text(\"TAPS %03d\", w.mole.taps);\n    at(1, 15).text(\"A: EMIT   B: HALF TAP\");\n  })\n  .build();\n","notes":"<h1>Proxy diagnostics<\/h1>\n<p>Three kinds of proxy watch the program:<\/p>\n<ul><li><b>Builder proxies<\/b> wrap every component, fragment and Game while you chain. An unknown method throws at that line with the closest name and the full list.<\/li>\n<li><b>Entity and world proxies<\/b> wrap what runtime lambdas see. Reading an unknown member, adding a new one, writing a baked constant or putting a value that does not fit an attribute's type each produce a message tied to the source line.<\/li>\n<li><b>Lint<\/b> reads each lambda's source at build time: <code>Math.random<\/code>, wall-clock time and async code are flagged, and events that are emitted but never handled (or the reverse) are reported.<\/li><\/ul>\n<p>Build errors mark the gutter red and keep the last good build on the stage. Runtime errors pause the stage with a red banner; runtime warnings are logged once each in <b>Events<\/b>.<\/p>"},{"id":"10","group":"Whack-a-mole","title":"Whack-a-mole","sub":"the full game: board, hammer, score, countdown, sound","code":"// Whack-a-mole for the DMG. D-pad moves the hammer, A whacks, Start restarts.\n// Build time: grid positions, background, bake. Runtime: timers, rules, frames, HUD.\n\nconst cell = (r, c) => ({ cx: 3 + c * 6, cy: 6 + r * 4 });\n\nconst MOLE = `\n  ................\n  .....333333.....\n  ...3322222233...\n  ..322222222223..\n  .32200222200223.\n  .32203222230223.\n  .32222211222223.\n  .32222111122223.\n  .32211122111223.\n  .32222200222223.\n  .32222222222223.\n  3322222222222233\n  3112222222222113\n  3332222222222333\n  ..322222222223..\n  ..322222222223..\n`;\nconst rows = MOLE.trim().split(\"\\n\");\nconst bonk = rows.slice();\nbonk[4] = \".32222222222223.\";\nbonk[5] = \".32333222233323.\";\n\n// ---- fragments ----\nconst Scorable = fragment(\"Scorable\")\n  .attr(\"score\", { type: \"u16\", max: 9999 })\n  .method(\"award\", (self, pts) => { self.score = self.score + pts; });\n\nconst Countdown = fragment(\"Countdown\")\n  .attr(\"secs\", { type: \"u8\" })\n  .init((w) => { w.secs = w.param(\"time\"); })\n  .onFrame((w) => { if (w.frame % 60 === 59 && w.secs > 0) w.secs--; });\n\n// ---- components ----\nconst Hammer = component(\"Hammer\")\n  .sprite(\"idle\", art`\n    ....33333333....\n    ...3222222223...\n    ...3211111123...\n    ...3211111123...\n    ...3222222223...\n    ....33333333....\n    ......3223......\n    ......3223......\n    ......3223......\n    ......3223......\n    ......3223......\n    ......3333......\n  `)\n  .sprite(\"smash\", art`\n    ................\n    ................\n    ................\n    ................\n    ....33333333....\n    ...3222222223...\n    ...3211111123...\n    ...3211111123...\n    ...3222222223...\n    ....33333333....\n    .3....3223....3.\n    3.....3223.....3\n    ......3223......\n    ......3333......\n  `)\n  .attr(\"cell\", { type: \"u8\", init: 4 })\n  .attr(\"hit\", { type: \"u8\" })\n  .onFrame((self, w) => {\n    const d = w.input.dpad();\n    if (d.x || d.y) self.cell = w.grid.step(self.cell, d.x, d.y);\n    if (self.hit) self.hit--;\n    if (w.input.pressed(\"A\") && !self.hit) {\n      self.hit = 8;\n      w.emit(\"whack\", { cell: self.cell });\n    }\n  })\n  .draw((self, w) => {\n    const m = w.board.at(self.cell);\n    return { sprite: self.hit > 3 ? \"smash\" : \"idle\", x: m.x, y: m.y - 8 };\n  });\n\nconst Mole = component(\"Mole\")\n  .sprite(\"up\", art(MOLE))\n  .sprite(\"peek\", art(rows.slice(0, 8).join(\"\\n\")))\n  .sprite(\"bonk\", art(bonk.join(\"\\n\")))\n  .attr(\"up\", { type: \"bool\" })\n  .attr(\"ttl\", { type: \"u16\" })\n  .attr(\"rise\", { type: \"u8\" })\n  .attr(\"bonk\", { type: \"u8\" })\n  .bake((self, ctx) => { self.stay = ctx.param(\"linger\").value * 60; })\n  .method(\"pop\", (self) => {\n    if (self.up || self.bonk) return false;\n    self.up = true; self.ttl = self.stay; self.rise = 8;\n    return true;\n  })\n  .method(\"hit\", (self) => { self.up = false; self.bonk = 24; })\n  .onFrame((self, w) => {\n    if (self.rise) self.rise--;\n    if (self.bonk) self.bonk--;\n    if (self.up && --self.ttl === 0) {\n      self.up = false;\n      w.emit(\"escaped\", { cell: self.index });\n    }\n  })\n  .draw((self) => {\n    if (self.bonk) return \"bonk\";\n    if (!self.up) return null;\n    return self.rise > 4 ? { sprite: \"peek\", y: self.y + 8 } : \"up\";\n  });\n\n// ---- game ----\nGame(\"whack\")\n  .screen(160, 144)\n  .palette(\"dmg\")\n  .param(\"linger\", slider({ min: 0.5, max: 4, step: 0.25, value: 1.5, label: \"Mole stays\", unit: \"s\" }))\n  .param(\"spawn\", slider({ min: 250, max: 1500, step: 50, value: 750, label: \"Spawn every\", unit: \"ms\", live: true }))\n  .param(\"time\", slider({ min: 15, max: 90, step: 5, value: 45, label: \"Round\", unit: \"s\" }))\n  .param(\"sound\", toggle({ value: true, label: \"Sound\", live: true }))\n  .tiles({\n    grass: art`\n      00000000\n      00010000\n      00000000\n      00000001\n      01000000\n      00000000\n      00001000\n      00000000\n    `,\n    hole: art`\n      0011111111111100\n      0133333333333310\n      1333333333333331\n      1333333333333331\n      1333333333333331\n      1333333333333331\n      0133333333333310\n      0011111111111100\n    `,\n  })\n  .background((bg) => {\n    bg.fill(\"grass\");\n    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) bg.set(cell(r, c).cx, cell(r, c).cy, \"hole\");\n  })\n  .place(Hammer)                                    // placed first: OAM 0 draws on top\n  .board((b) => b.grid(3, 3, Mole, (r, c) => ({ x: cell(r, c).cx * 8, y: cell(r, c).cy * 8 - 10 })))\n  .with(Scorable, Countdown)\n  .attr(\"misses\", { type: \"u8\" })\n  .attr(\"escaped\", { type: \"u8\" })\n  .sfx(\"hit\", { f: 880, to: 220, ms: 90 })\n  .sfx(\"miss\", { f: 160, ms: 50, wave: \"noise\" })\n  .sfx(\"pop\", { f: 520, to: 780, ms: 30, vol: 0.4 })\n  .timer(\"spawn\", { every: $.param(\"spawn\") }, (w) => {\n    const m = w.rng.pick(w.board.filter((m) => !m.up && !m.bonk));\n    if (m && m.pop() && w.param(\"sound\")) w.sfx(\"pop\");\n  })\n  .on(\"whack\", (w, e) => {\n    const m = w.board.at(e.cell);\n    if (m.up && m.rise < 6) {\n      m.hit();\n      w.award(100);\n      w.toast(\"WHACK\", \"+100\");\n      if (w.param(\"sound\")) w.sfx(\"hit\");\n    } else {\n      w.misses++;\n      if (w.param(\"sound\")) w.sfx(\"miss\");\n    }\n  })\n  .on(\"escaped\", (w) => { w.escaped++; })\n  .hud((w, at) => {\n    at(0, 0).text(\"SCORE %04d\", w.score);\n    at(13, 0).text(\"TIME %02d\", w.secs);\n    if (w.over) {\n      at(5, 8).text(\"GAME OVER\");\n      at(4, 10).text(\"PRESS START\");\n    }\n  })\n  .done((w) => w.secs === 0)\n  .build();\n","notes":"<h1>Whack-a-mole<\/h1>\n<p>The whole game in one chain. Controls: arrow keys or WASD move, <kbd>X<\/kbd> or <kbd>K<\/kbd> is A, <kbd>Enter<\/kbd> is Start.<\/p>\n<h3>What runs when<\/h3>\n<ul><li><b>Build<\/b>: <code>cell()<\/code>, the grid position lambda, <code>background<\/code>, <code>Mole.bake<\/code> (which turns <i>linger<\/i> into a frame count), and the art helpers that cut <i>peek<\/i> and <i>bonk<\/i> out of the mole.<\/li>\n<li><b>Runtime<\/b>: the spawn timer (rereads the live <i>spawn<\/i> param), the two rules, each component's onFrame and draw, the HUD and the <code>done<\/code> test.<\/li><\/ul>\n<p>The hammer is placed before the board on purpose: on the DMG the lower OAM index wins when sprites overlap.<\/p>\n<h3>Try<\/h3>\n<ul><li>Open <b>Graph<\/b>: follow <i>input → Hammer.onFrame → whack → rule whack → sfx hit<\/i>.<\/li>\n<li>Open <b>C<\/b> to see the folded <code>#define<\/code>s, the 2bpp tile arrays and the struct per component.<\/li><\/ul>"},{"id":"11","group":"Whack-a-mole","title":"Golden moles and bombs","sub":"enum attrs, lives, weighted spawns","code":"// Three kinds of mole share one component: an enum attribute picks the sprite\n// and the rule. Gold is worth 500, a bomb costs a life. Start restarts.\n\nconst cell = (r, c) => ({ cx: 3 + c * 6, cy: 6 + r * 4 });\nconst MOLE = `\n  ................\n  .....333333.....\n  ...3322222233...\n  ..322222222223..\n  .32200222200223.\n  .32203222230223.\n  .32222211222223.\n  .32222111122223.\n  .32211122111223.\n  .32222200222223.\n  .32222222222223.\n  3322222222222233\n  3112222222222113\n  3332222222222333\n  ..322222222223..\n  ..322222222223..\n`;\nconst GOLD = MOLE.replace(/[12]/g, (c) => (c === \"2\" ? \"1\" : \"0\"));   // lighter body, built at build time\n\nconst Lives = fragment(\"Lives\")\n  .attr(\"lives\", { type: \"u8\", init: 3 })\n  .hud((w, at) => at(0, 17).text(\"LIVES \" + \"@\".repeat(w.lives)));\n\nconst Mole = component(\"Mole\")\n  .sprite(\"mole\", art(MOLE))\n  .sprite(\"gold\", art(GOLD))\n  .sprite(\"bomb\", art`\n    ..........33....\n    .........3..3...\n    ........3.......\n    .....333333.....\n    ...3333333333...\n    ..333333333333..\n    ..330033333333..\n    .33303333333333.\n    .33333333333333.\n    .33333333333333.\n    .33333333333333.\n    ..333333333333..\n    ..333333333333..\n    ...3333333333...\n    .....333333.....\n  `)\n  .attr(\"breed\", { type: \"enum\", values: [\"mole\", \"gold\", \"bomb\"] })\n  .attr(\"up\", { type: \"bool\" })\n  .attr(\"ttl\", { type: \"u8\" })\n  .onFrame((self) => { if (self.up && --self.ttl === 0) self.up = false; })\n  .draw((self) => (self.up ? self.breed : null));\n\nconst Hammer = component(\"Hammer\")\n  .sprite(\"idle\", art`\n    ....33333333....\n    ...3222222223...\n    ...3211111123...\n    ...3211111123...\n    ...3222222223...\n    ....33333333....\n    ......3223......\n    ......3223......\n    ......3223......\n    ......3333......\n  `)\n  .attr(\"cell\", { type: \"u8\", init: 4 })\n  .onFrame((self, w) => {\n    const d = w.input.dpad();\n    self.cell = w.grid.step(self.cell, d.x, d.y);\n    if (w.input.pressed(\"A\")) w.emit(\"whack\", { cell: self.cell });\n  })\n  .draw((self, w) => ({ x: w.board.at(self.cell).x, y: w.board.at(self.cell).y - 8 + (w.input.held(\"A\") ? 4 : 0) }));\n\nGame(\"gold-and-bombs\")\n  .screen(160, 144)\n  .param(\"gold\", slider({ min: 0, max: 40, value: 12, label: \"Gold chance\", unit: \"%\", live: true }))\n  .param(\"bombs\", slider({ min: 0, max: 50, value: 20, label: \"Bomb chance\", unit: \"%\", live: true }))\n  .param(\"spawn\", slider({ min: 250, max: 1200, step: 50, value: 650, label: \"Spawn every\", unit: \"ms\", live: true }))\n  .tiles({\n    grass: art`\n      00000000\n      00010000\n      00000000\n      00000001\n      01000000\n      00000000\n      00001000\n      00000000\n    `,\n    hole: art`\n      0011111111111100\n      0133333333333310\n      1333333333333331\n      1333333333333331\n      1333333333333331\n      1333333333333331\n      0133333333333310\n      0011111111111100\n    `,\n  })\n  .background((bg) => {\n    bg.fill(\"grass\");\n    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) bg.set(cell(r, c).cx, cell(r, c).cy, \"hole\");\n  })\n  .place(Hammer)\n  .board((b) => b.grid(3, 3, Mole, (r, c) => ({ x: cell(r, c).cx * 8, y: cell(r, c).cy * 8 - 10 })))\n  .with(Lives)\n  .attr(\"score\", { type: \"u16\", max: 9999 })\n  .sfx(\"hit\", { f: 880, to: 220, ms: 90 })\n  .sfx(\"gold\", { f: 660, to: 1320, ms: 160 })\n  .sfx(\"boom\", { f: 120, ms: 260, wave: \"noise\", vol: 0.8 })\n  .timer(\"spawn\", { every: $.param(\"spawn\") }, (w) => {\n    const m = w.rng.pick(w.board.filter((m) => !m.up));\n    if (!m) return;\n    const roll = w.rand(100);\n    m.breed = roll < w.param(\"bombs\") ? \"bomb\" : roll < w.param(\"bombs\") + w.param(\"gold\") ? \"gold\" : \"mole\";\n    m.up = true;\n    m.ttl = m.breed === \"gold\" ? 45 : 80;\n  })\n  .on(\"whack\", (w, e) => {\n    const m = w.board.at(e.cell);\n    if (!m.up) return;\n    m.up = false;\n    if (m.breed === \"bomb\") { w.lives--; w.sfx(\"boom\"); w.toast(\"BOOM\", \"-1 life\"); }\n    else if (m.breed === \"gold\") { w.score += 500; w.sfx(\"gold\"); w.toast(\"GOLD\", \"+500\"); }\n    else { w.score += 100; w.sfx(\"hit\"); }\n  })\n  .hud((w, at) => {\n    at(0, 0).text(\"SCORE %04d\", w.score);\n    if (w.over) { at(5, 8).text(\"GAME OVER\"); at(4, 10).text(\"PRESS START\"); }\n  })\n  .done((w) => w.lives === 0)\n  .build();\n","notes":"<h1>Golden moles and bombs<\/h1>\n<p>An <code>enum<\/code>
