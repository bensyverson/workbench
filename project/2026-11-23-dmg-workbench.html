attribute holds one of a fixed list of values (one byte on the device). Assigning anything else throws, with the closest value suggested. The draw lambda returns the enum value directly, because the sprite names match it.<\/p>\n<p>The gold sprite is made at build time with a regex over the mole's art: no new pixels to draw, and only new tiles in VRAM (see <b>Tiles<\/b>).<\/p>\n<h3>Try<\/h3>\n<ul><li>Set <b>Bomb chance<\/b> to 50 and watch <b>Events<\/b> fill with <i>boom<\/i>.<\/li>\n<li>In the spawn timer, assign <code>m.breed = \"golden\"<\/code> and read the runtime error.<\/li><\/ul>"},{"id":"12","group":"Whack-a-mole","title":"Frenzy","sub":"a timer whose interval is a runtime lambda; combos","code":"// The spawn interval is a lambda of the world, evaluated each time the timer\n// re-arms, so the game speeds up with the score. Hit quickly in a row for combos.\n\nconst cell = (r, c) => ({ cx: 3 + c * 6, cy: 6 + r * 4 });\nconst MOLE = `\n  ................\n  .....333333.....\n  ...3322222233...\n  ..322222222223..\n  .32200222200223.\n  .32203222230223.\n  .32222211222223.\n  .32222111122223.\n  .32211122111223.\n  .32222200222223.\n  .32222222222223.\n  3322222222222233\n  3112222222222113\n  3332222222222333\n  ..322222222223..\n  ..322222222223..\n`;\n\nconst Mole = component(\"Mole\")\n  .sprite(\"up\", art(MOLE))\n  .attr(\"up\", { type: \"bool\" })\n  .attr(\"ttl\", { type: \"u8\" })\n  .method(\"pop\", (self, ttl) => { self.up = true; self.ttl = ttl; })\n  .onFrame((self, w) => {\n    if (self.up && --self.ttl === 0) { self.up = false; w.emit(\"escaped\"); }\n  })\n  .draw((self) => (self.up ? \"up\" : null));\n\nconst Hammer = component(\"Hammer\")\n  .sprite(\"idle\", art`\n    ....33333333....\n    ...3222222223...\n    ...3211111123...\n    ...3211111123...\n    ...3222222223...\n    ....33333333....\n    ......3223......\n    ......3223......\n    ......3223......\n    ......3333......\n  `)\n  .attr(\"cell\", { type: \"u8\", init: 4 })\n  .onFrame((self, w) => {\n    const d = w.input.dpad();\n    self.cell = w.grid.step(self.cell, d.x, d.y);\n    if (w.input.pressed(\"A\")) w.emit(\"whack\", { cell: self.cell });\n  })\n  .draw((self, w) => ({ x: w.board.at(self.cell).x, y: w.board.at(self.cell).y - 8 }));\n\nGame(\"frenzy\")\n  .screen(160, 144)\n  .param(\"start\", slider({ min: 600, max: 1600, step: 50, value: 1100, label: \"Start interval\", unit: \"ms\", live: true }))\n  .param(\"floor\", slider({ min: 150, max: 600, step: 25, value: 260, label: \"Fastest interval\", unit: \"ms\", live: true }))\n  .param(\"ramp\", slider({ min: 1, max: 12, value: 5, label: \"Points per ms faster\", live: true }))\n  .tiles({\n    grass: art`\n      00000000\n      00010000\n      00000000\n      00000001\n      01000000\n      00000000\n      00001000\n      00000000\n    `,\n    hole: art`\n      0011111111111100\n      0133333333333310\n      1333333333333331\n      1333333333333331\n      1333333333333331\n      1333333333333331\n      0133333333333310\n      0011111111111100\n    `,\n  })\n  .background((bg) => {\n    bg.fill(\"grass\");\n    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) bg.set(cell(r, c).cx, cell(r, c).cy, \"hole\");\n  })\n  .place(Hammer)\n  .board((b) => b.grid(3, 3, Mole, (r, c) => ({ x: cell(r, c).cx * 8, y: cell(r, c).cy * 8 - 10 })))\n  .attr(\"score\", { type: \"u16\", max: 9999 })\n  .attr(\"combo\", { type: \"u8\", max: 9 })\n  .attr(\"best\", { type: \"u8\" })\n  .attr(\"lost\", { type: \"u8\" })\n  .sfx(\"hit\", { f: 700, to: 1400, ms: 70 })\n  .sfx(\"combo\", { f: 990, to: 1980, ms: 120 })\n  .timer(\"spawn\", { every: (w) => Math.max(w.param(\"floor\"), w.param(\"start\") - w.score / w.param(\"ramp\")) }, (w) => {\n    const m = w.rng.pick(w.board.filter((m) => !m.up));\n    const ttl = Math.max(24, 100 - (w.score >> 6));\n    if (m) m.pop(ttl);\n  })\n  .on(\"whack\", (w, e) => {\n    const m = w.board.at(e.cell);\n    if (!m.up) { w.combo = 0; return; }\n    m.up = false;\n    w.combo++;\n    if (w.combo > w.best) w.best = w.combo;\n    w.score += 10 * w.combo;\n    if (w.combo >= 3) { w.toast(\"COMBO X\" + w.combo, \"+\" + 10 * w.combo); w.sfx(\"combo\"); } else w.sfx(\"hit\");\n  })\n  .on(\"escaped\", (w) => { w.combo = 0; w.lost++; })\n  .hud((w, at) => {\n    at(0, 0).text(\"%04d\", w.score);\n    at(6, 0).text(\"X%d\", w.combo);\n    at(12, 0).text(\"MISS %d/5\", w.lost);\n    if (w.over) { at(5, 8).text(\"GAME OVER\"); at(5, 10).text(\"BEST X%d\", w.best); }\n  })\n  .done((w) => w.lost >= 5)\n  .build();\n","notes":"<h1>Frenzy<\/h1>\n<p>A timer's <code>every<\/code> can be a number (folded), a <code>$.param<\/code> reference (folded or live), or a lambda of the world. The lambda runs on the device every time the timer re-arms, which the IR shows as <i>every λ(w) runtime<\/i>, with edges from each param it reads.<\/p>\n<p><code>max: 9<\/code> on <i>combo<\/i> clamps silently; that is a declared limit, unlike the wrap you get when a value overflows its type.<\/p>\n<h3>Try<\/h3>\n<ul><li>Drop <b>Fastest interval<\/b> to 150 ms and see how long you last.<\/li>\n<li>Replace the lambda with <code>$.param(\"start\")<\/code> and compare the graph.<\/li><\/ul>"},{"id":"13","group":"Whack-a-mole","title":"4×4 with a bot","sub":"bot policy, headless episodes, parameter sweeps","code":"// A 4×4 board and a bot. Turn the bot on (header or Agent view) and it drives the\n// same input the d-pad does. In Agent you can run headless episodes and sweeps.\n\nconst cell = (r, c) => ({ cx: 2 + c * 4, cy: 5 + r * 3 });\nconst MOLE = `\n  ................\n  .....333333.....\n  ...3322222233...\n  ..322222222223..\n  .32200222200223.\n  .32203222230223.\n  .32222211222223.\n  .32222111122223.\n  .32211122111223.\n  .32222200222223.\n  .32222222222223.\n  3322222222222233\n  3112222222222113\n  3332222222222333\n  ..322222222223..\n  ..322222222223..\n`;\n\nconst Countdown = fragment(\"Countdown\")\n  .attr(\"secs\", { type: \"u8\", init: 40 })\n  .onFrame((w) => { if (w.frame % 60 === 59 && w.secs > 0) w.secs--; });\n\nconst Mole = component(\"Mole\")\n  .sprite(\"up\", art(MOLE))\n  .attr(\"up\", { type: \"bool\" })\n  .attr(\"ttl\", { type: \"u8\" })\n  .bake((self, ctx) => { self.stay = Math.round(ctx.param(\"linger\").value * 60); })\n  .onFrame((self) => { if (self.up && --self.ttl === 0) self.up = false; })\n  .draw((self) => (self.up ? \"up\" : null));\n\nconst Hammer = component(\"Hammer\")\n  .sprite(\"idle\", art`\n    ....33333333....\n    ...3222222223...\n    ...3211111123...\n    ...3211111123...\n    ...3222222223...\n    ....33333333....\n    ......3223......\n    ......3223......\n    ......3333......\n  `)\n  .attr(\"cell\", { type: \"u8\", init: 5 })\n  .onFrame((self, w) => {\n    const d = w.input.dpad();\n    self.cell = w.grid.step(self.cell, d.x, d.y);\n    if (w.input.pressed(\"A\")) w.emit(\"whack\", { cell: self.cell });\n  })\n  .draw((self, w) => ({ x: w.board.at(self.cell).x, y: w.board.at(self.cell).y - 7 }));\n\nGame(\"whack-4x4\")\n  .screen(160, 144)\n  .param(\"linger\", slider({ min: 0.5, max: 3, step: 0.25, value: 1.25, label: \"Mole stays\", unit: \"s\" }))\n  .param(\"spawn\", slider({ min: 200, max: 1200, step: 50, value: 500, label: \"Spawn every\", unit: \"ms\", live: true }))\n  .param(\"reflex\", slider({ min: 2, max: 16, value: 6, label: \"Bot frames per tap\", live: true }))\n  .tiles({\n    grass: art`\n      00000000\n      00010000\n      00000000\n      00000001\n      01000000\n      00000000\n      00001000\n      00000000\n    `,\n    hole: art`\n      0011111111111100\n      0133333333333310\n      1333333333333331\n      1333333333333331\n      1333333333333331\n      1333333333333331\n      0133333333333310\n      0011111111111100\n    `,\n  })\n  .background((bg) => {\n    bg.fill(\"grass\");\n    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) bg.set(cell(r, c).cx, cell(r, c).cy, \"hole\");\n  })\n  .place(Hammer)\n  .board((b) => b.grid(4, 4, Mole, (r, c) => ({ x: cell(r, c).cx * 8, y: cell(r, c).cy * 8 - 10 })))\n  .with(Countdown)\n  .attr(\"score\", { type: \"u16\", max: 9999 })\n  .sfx(\"hit\", { f: 880, to: 220, ms: 70 })\n  .timer(\"spawn\", { every: $.param(\"spawn\") }, (w) => {\n    const m = w.rng.pick(w.board.filter((m) => !m.up));\n    if (m) { m.up = true; m.ttl = m.stay; }\n  })\n  .on(\"whack\", (w, e) => {\n    const m = w.board.at(e.cell);\n    if (m.up) { m.up = false; w.score += 100; w.sfx(\"hit\"); }\n  })\n  .bot((w) => {\n    if (w.frame % w.param(\"reflex\")) return null;          // a thumb is not infinitely fast\n    const up = w.board.filter((m) => m.up);\n    if (!up.length) return null;\n    const t = up.reduce((a, m) => (m.ttl < a.ttl ? m : a));  // most urgent first\n    const at = w.grid.rc(w.hammer.cell), to = w.grid.rc(t.index);\n    if (to.c !== at.c) return to.c > at.c ? \"right\" : \"left\";\n    if (to.r !== at.r) return to.r > at.r ? \"down\" : \"up\";\n    return \"A\";\n  })\n  .hud((w, at) => {\n    at(0, 0).text(\"SCORE %04d\", w.score);\n    at(13, 0).text(\"TIME %02d\", w.secs);\n    if (w.over) { at(5, 8).text(\"GAME OVER\"); at(4, 10).text(\"PRESS START\"); }\n  })\n  .done((w) => w.secs === 0)\n  .build();\n","notes":"<h1>4×4 with a bot<\/h1>\n<p><code>.bot((w) =&gt; buttons)<\/code> is a policy: each frame it reads the whole world and returns a button, a list, or an object of booleans. When the bot is on, its output replaces the pad, so the game code cannot tell the difference.<\/p>\n<p>The same build can also run headless: <code>build.runtime({ seed })<\/code> gives an environment with <code>reset()<\/code>, <code>step(buttons, { frames })<\/code> and <code>mutate(fn)<\/code>. The <b>Agent<\/b> uses it through <code>test()<\/code>: ask it to compare reflex settings over several seeds and it runs them at full speed.<\/p>\n<h3>Try<\/h3>\n<ul><li>Ask the <b>Agent<\/b>: \"Run the bot with reflex 2, 6 and 12 over three seeds each and tell me how the score changes.\"<\/li>\n<li>In the <b>Events<\/b> console, run <code>w.secs = 99<\/code> to change the live world directly.<\/li><\/ul>"},{"id":"14","group":"Whack-a-mole","title":"Memory moles","sub":"a world state machine without arrays","code":"// Watch the moles, then whack them in the same order. The sequence is never\n// stored: a hash of (seed, step) regenerates it, the way a DMG game saves RAM.\n\nconst cell = (r, c) => ({ cx: 3 + c * 6, cy: 6 + r * 4 });\nconst nth = (seed, i) => ((seed * 97 + i * 131 + ((i * i) ^ seed)) >>> 0) % 9;\nconst MOLE = `\n  ................\n  .....333333.....\n  ...3322222233...\n  ..322222222223..\n  .32200222200223.\n  .32203222230223.\n  .32222211222223.\n  .32222111122223.\n  .32211122111223.\n  .32222200222223.\n  .32222222222223.\n  3322222222222233\n  3112222222222113\n  3332222222222333\n  ..322222222223..\n  ..322222222223..\n`;\n\nconst Mole = component(\"Mole\")\n  .sprite(\"up\", art(MOLE))\n  .attr(\"lit\", { type: \"u8\" })\n  .onFrame((self) => { if (self.lit) self.lit--; })\n  .draw((self) => (self.lit ? \"up\" : null));\n\nconst Hammer = component(\"Hammer\")\n  .sprite(\"idle\", art`\n    ....33333333....\n    ...3222222223...\n    ...3211111123...\n    ...3211111123...\n    ...3222222223...\n    ....33333333....\n    ......3223......\n    ......3223......\n    ......3333......\n  `)\n  .attr(\"cell\", { type: \"u8\", init: 4 })\n  .onFrame((self, w) => {\n    if (w.phase !== \"input\") return;\n    const d = w.input.dpad();\n    self.cell = w.grid.step(self.cell, d.x, d.y);\n    if (w.input.pressed(\"A\")) w.emit(\"guess\", { cell: self.cell });\n  })\n  .draw((self, w) => (w.phase === \"input\" ? { x: w.board.at(self.cell).x, y: w.board.at(self.cell).y - 8 } : null));\n\nGame(\"memory\")\n  .screen(160, 144)\n  .param(\"pace\", slider({ min: 12, max: 60, step: 2, value: 34, label: \"Show pace\", unit: \"frames\", live: true }))\n  .tiles({\n    grass: art`\n      00000000\n      00010000\n      00000000\n      00000001\n      01000000\n      00000000\n      00001000\n      00000000\n    `,\n    hole: art`\n      0011111111111100\n      0133333333333310\n      1333333333333331\n      1333333333333331\n      1333333333333331\n      1333333333333331\n      0133333333333310\n      0011111111111100\n    `,\n  })\n  .background((bg) => {\n    bg.fill(\"grass\");\n    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) bg.set(cell(r, c).cx, cell(r, c).cy, \"hole\");\n  })\n  .place(Hammer)\n  .board((b) => b.grid(3, 3, Mole, (r, c) => ({ x: cell(r, c).cx * 8, y: cell(r, c).cy * 8 - 10 })))\n  .attr(\"phase\", { type: \"enum\", values: [\"show\", \"input\", \"fail\"] })\n  .attr(\"seed\", { type: \"u16\" })\n  .attr(\"len\", { type: \"u8\", init: 3 })\n  .attr(\"pos\", { type: \"u8\" })\n  .attr(\"clock\", { type: \"u8\" })\n  .init((w) => { w.seed = 1 + w.rand(5000); })\n  .sfx(\"show\", { f: 523, ms: 120 })\n  .sfx(\"ok\", { f: 784, ms: 60 })\n  .sfx(\"bad\", { f: 110, ms: 300, wave: \"noise\" })\n  .onFrame((w) => {\n    if (w.phase !== \"show\") return;\n    if (++w.clock < w.param(\"pace\")) return;\n    w.clock = 0;\n    if (w.pos === w.len) { w.phase = \"input\"; w.pos = 0; return; }\n    w.board.at(nth(w.seed, w.pos)).lit = w.param(\"pace\") - 6;\n    w.sfx(\"show\");\n    w.pos++;\n  })\n  .on(\"guess\", (w, e) => {\n    w.board.at(e.cell).lit = 10;\n    if (e.cell !== nth(w.seed, w.pos)) { w.phase = \"fail\"; w.sfx(\"bad\"); w.end(\"wrong\"); return; }\n    w.sfx(\"ok\");\n    if (++w.pos === w.len) {\n      w.toast(\"ROUND \" + (w.len - 2), \"len \" + (w.len + 1));\n      w.len++; w.pos = 0; w.clock = 0; w.phase = \"show\";\n    }\n  })\n  .hud((w, at) => {\n    at(0, 0).text(w.phase === \"show\" ? \"WATCH\" : w.phase === \"input\" ? \"YOUR TURN %d/%d\" : \"WRONG\", w.pos, w.len);\n    at(15, 0).text(\"LV %02d\", w.len - 2);\n    if (w.over) at(4, 10).text(\"PRESS START\");\n  })\n  .build();\n","notes":"<h1>Memory moles<\/h1>\n<p>Attributes are scalars (one or two bytes each), as WRAM thinking suggests. The sequence lives in no array: <code>nth(seed, i)<\/code> recomputes step <i>i<\/i> from a 16-bit seed, so the whole game state is five bytes plus nine timers.<\/p>\n<p>The phase is an <code>enum<\/code> world attribute; each lambda early-returns unless it is its phase's turn. This is a state machine with no framework.<\/p>\n<h3>Try<\/h3>\n<ul><li>Watch the world attributes in the stage side panel while you play.<\/li>\n<li>Slow the <b>Show pace<\/b> right down, then speed it up between rounds.<\/li><\/ul>"},{"id":"20","group":"Other games","title":"Pong","sub":"two placements of one component, aliases, fix-point ball","code":"// One Paddle component placed twice under two names. The CPU's speed is live.\n// Up/down moves your paddle; first to the target wins; Start restarts.\n\nconst row = (a, b, c, n) => a + b.repeat(n) + c;\nconst PADDLE = art([row(\".\", \"3\", \".\", 6), ...Array(22).fill(row(\"32\", \"1\", \"23\", 4)), row(\".\", \"3\", \".\", 6)].join(\"\\n\"));\n\nconst Paddle = component(\"Paddle\")\n  .sprite(\"bar\", PADDLE)\n  .attr(\"cpu\", { type: \"bool\" })\n  .onFrame((self, w) => {\n    let dy;\n    if (self.cpu) {\n      const want = w.ball.y + 4 - 12 - self.y, s = w.param(\"cpu\");\n      dy = Math.max(-s, Math.min(s, want));\n    } else dy = w.input.axis().y * 2;\n    self.y = Math.max(16, Math.min(112, self.y + dy));\n  });\n\nconst Ball = component(\"Ball\")\n  .sprite(\"ball\", art`\n    ..3333..\n    .322223.\n    32200223\n    32202223\n    32222223\n    32222223\n    .322223.\n    ..3333..\n  `)\n  .hitbox(1, 1, 6, 6)\n  .attr(\"vx\", { type: \"fix\", init: 1.5 })\n  .attr(\"vy\", { type: \"fix\", init: 0.5 })\n  .onFrame((self, w) => {\n    self.x += self.vx;\n    self.y += self.vy;\n    if (self.y < 16 || self.y > 128) { self.vy = -self.vy; self.y = Math.max(16, Math.min(128, self.y)); }\n    for (const p of [w.player, w.cpu]) {\n      if (self.hits(p) && Math.sign(self.vx) === (p.cpu ? 1 : -1)) {\n        self.vx = Math.max(-4, Math.min(4, -self.vx * 1.08));\n        self.vy = (self.y + 4 - (p.y + 12)) / 6;\n        w.sfx(\"pad\");\n      }\n    }\n    if (self.x < -8 || self.x > 160) w.emit(\"point\", { cpu: self.x < 0 });\n  });\n\nGame(\"pong\")\n  .screen(160, 144)\n  .param(\"cpu\", slider({ min: 0.5, max: 3, step: 0.25, value: 1.25, label: \"CPU speed\", unit: \"px/f\", live: true }))\n  .param(\"to\", slider({ min: 3, max: 11, value: 5, label: \"Points to win\" }))\n  .tiles({\n    net: art`\n      00033000\n      00033000\n      00033000\n      00000000\n      00000000\n      00000000\n      00000000\n      00000000\n    `,\n    top: art`\n      00000000\n      00000000\n      00000000\n      00000000\n      00000000\n      00000000\n      33333333\n      33333333\n    `,\n    bottom: art`\n      33333333\n      33333333\n      00000000\n      00000000\n      00000000\n      00000000\n      00000000\n      00000000\n    `,\n  })\n  .background((bg) => {\n    bg.fill(\"blank\");\n    bg.rect(0, 1, 20, 1, \"top\");\n    bg.rect(0, 17, 20, 1, \"bottom\");\n    bg.rect(9, 2, 1, 15, \"net\");\n  })\n  .place(Ball, { x: 76, y: 72 })\n  .place(Paddle, { x: 8, y: 60 }, { as: \"player\" })\n  .place(Paddle, { x: 144, y: 60, cpu: true }, { as: \"cpu\" })\n  .attr(\"p1\", { type: \"u8\" })\n  .attr(\"p2\", { type: \"u8\" })\n  .sfx(\"pad\", { f: 440, ms: 40 })\n  .sfx(\"point\", { f: 220, to: 110, ms: 200 })\n  .on(\"point\", (w, e) => {\n    if (e.cpu) w.p2++; else w.p1++;\n    w.sfx(\"point\");\n    const b = w.ball;\n    b.x = 76; b.y = 72;\n    b.vx = e.cpu ? 1.5 : -1.5;\n    b.vy = (w.rand(5) - 2) / 2;\n  })\n  .bot((w) => {\n    const t = w.ball.y - 8, p = w.player.y;\n    return t < p - 2 ? \"up\" : t > p + 2 ? \"down\" : null;\n  })\n  .hud((w, at) => {\n    at(6, 0).text(\"%d\", w.p1);\n    at(13, 0).text(\"%d\", w.p2);\n    if (w.over) at(5, 8).text(w.p1 > w.p2 ? \" YOU WIN \" : \"CPU WINS\");\n  })\n  .done((w) => w.p1 >= w.param(\"to\") || w.p2 >= w.param(\"to\"))\n  .build();\n","notes":"<h1>Pong<\/h1>\n<p><code>.place(Paddle, init, { as: \"player\" })<\/code> names an entity so lambdas can reach it as <code>w.player<\/code>. Without <code>as<\/code>, the name is the component's, lower-camel (<code>w.ball<\/code>).<\/p>\n<p>The paddle art is built with JavaScript from three row patterns, then checked like any other art. At 8×24 it costs two objects in 8×16 mode, three in 8×8 mode.<\/p>\n<p>Ball speed is <code>fix<\/code>: the 8% speed-up per hit keeps its fraction.<\/p>\n<h3>Try<\/h3>\n<ul><li>Turn the bot on and set <b>CPU speed<\/b> to 3: two machines rally.<\/li>\n<li>Remove <code>{ as: \"cpu\" }<\/code>: the second placement collides with the first name and the builder says so.<\/li><\/ul>"},{"id":"21","group":"Other games","title":"Snake","sub":"the background map as memory; no sprites at all","code":"// The snake is entirely background tiles. Each body tile records the direction\n// the snake left it in, so the tail can follow without an array of positions.\n\nconst BODY = art`\n  02222220\n  23333332\n  23333332\n  23333332\n  23333332\n  23333332\n  23333332\n  02222220\n`;\nconst DIRS = { up: [0, -1, \"bu\"], down: [0, 1, \"bd\"], left: [-1, 0, \"bl\"], right: [1, 0, \"br\"] };\nconst BACK = { up: \"down\", down: \"up\", left: \"right\", right: \"left\" };\nconst placeFood = (w) => {\n  for (let i = 0; i < 300; i++) {\n    const x = 1 + w.rand(18), y = 2 + w.rand(15);\n    if (w.bg.get(x, y) === \"floor\") { w.bg.set(x, y, \"food\"); w.fx = x; w.fy = y; return; }\n  }\n};\n\nGame(\"snake\")\n  .screen(160, 144)\n  .param(\"speed\", slider({ min: 2, max: 14, value: 7, label: \"Frames per step\", live: true }))\n  .param(\"grow\", slider({ min: 1, max: 6, value: 3, label: \"Growth per food\", live: true }))\n  .tiles({\n    floor: art`\n      00000000\n      00000000\n      00000000\n      00010000\n      00000000\n      00000000\n      00000000\n      00000000\n    `,\n    wall: art`\n      33333333\n      32223222\n      32223222\n      33333333\n      22322232\n      22322232\n      33333333\n      32223222\n    `,\n    head: art`\n      02222220\n      23333332\n      23033032\n      23333332\n      23333332\n      23311332\n      23333332\n      02222220\n    `,\n    food: art`\n      00000300\n      00003000\n      00333300\n      03222230\n      03222230\n      03222230\n      00333300\n      00000000\n    `,\n    bu: BODY, bd: BODY, bl: BODY, br: BODY,\n  })\n  .background((bg) => {\n    bg.fill(\"floor\");\n    bg.rect(0, 1, 20, 1, \"wall\");\n    bg.rect(0, 17, 20, 1, \"wall\");\n    bg.rect(0, 1, 1, 17, \"wall\");\n    bg.rect(19, 1, 1, 17, \"wall\");\n    bg.set(5, 9, \"br\").set(6, 9, \"br\").set(7, 9, \"head\");\n    bg.set(14, 9, \"food\");\n  })\n  .attr(\"hx\", { type: \"u8\", init: 7 }).attr(\"hy\", { type: \"u8\", init: 9 })\n  .attr(\"tx\", { type: \"u8\", init: 5 }).attr(\"ty\", { type: \"u8\", init: 9 })\n  .attr(\"fx\", { type: \"u8\", init: 14 }).attr(\"fy\", { type: \"u8\", init: 9 })\n  .attr(\"dir\", { type: \"enum\", values: [\"right\", \"down\", \"left\", \"up\"] })\n  .attr(\"next\", { type: \"enum\", values: [\"right\", \"down\", \"left\", \"up\"] })\n  .attr(\"grow\", { type: \"u8\" })\n  .attr(\"tick\", { type: \"u8\" })\n  .attr(\"score\", { type: \"u16\" })\n  .sfx(\"eat\", { f: 660, to: 990, ms: 60 })\n  .sfx(\"crash\", { f: 90, ms: 400, wave: \"noise\" })\n  .onFrame((w) => {\n    for (const d of [\"up\", \"down\", \"left\", \"right\"]) if (w.input.pressed(d) && d !== BACK[w.dir]) w.next = d;\n    if (++w.tick < w.param(\"speed\")) return;\n    w.tick = 0;\n    w.dir = w.next;\n    const [dx, dy, mark] = DIRS[w.dir];\n    w.bg.set(w.hx, w.hy, mark);                       // the head cell remembers where we went\n    const nx = w.hx + dx, ny = w.hy + dy, there = w.bg.get(nx, ny);\n    if (there !== \"floor\" && there !== \"food\") { w.sfx(\"crash\"); return w.end(\"crash\"); }\n    if (there === \"food\") { w.grow += w.param(\"grow\"); w.score += 10; w.sfx(\"eat\"); placeFood(w); }\n    w.hx = nx; w.hy = ny;\n    w.bg.set(nx, ny, \"head\");\n    if (w.grow) { w.grow--; return; }\n    const t = w.bg.get(w.tx, w.ty), back = Object.values(DIRS).find((d) => d[2] === t);\n    w.bg.set(w.tx, w.ty, \"floor\");\n    w.tx += back[0]; w.ty += back[1];\n  })\n  .bot((w) => {\n    const ok = (d) => { const [dx, dy] = DIRS[d], n = w.bg.get(w.hx + dx, w.hy + dy); return n === \"floor\" || n === \"food\"; };\n    const want = [w.fx > w.hx ? \"right\" : w.fx < w.hx ? \"left\" : null, w.fy > w.hy ? \"down\" : w.fy < w.hy ? \"up\" : null];\n    for (const d of [...want, w.dir, \"up\", \"right\", \"down\", \"left\"]) if (d && d !== BACK[w.dir] && ok(d)) return w.tick === 0 ? d : null;\n    return null;\n  })\n  .hud((w, at) => {\n    at(0, 0).text(\"SCORE %04d\", w.score);\n    if (w.over) { at(5, 8).text(\"GAME OVER\"); at(4, 10).text(\"PRESS START\"); }\n  })\n  .build();\n","notes":"<h1>Snake<\/h1>\n<p>No components and no OAM: the snake, the food and the walls are background tiles, changed at runtime with <code>w.bg.set<\/code>. The four body tiles <i>bu<\/i>, <i>bd<\/i>, <i>bl<\/i>, <i>br<\/i> share one picture, so they cost one tile of VRAM after de-duplication (see <b>Budget<\/b>), but their names tell the tail which way to go.<\/p>\n<p>Restarting reloads the map baked by <code>background()<\/code>.<\/p>\n<h3>Try<\/h3>\n<ul><li>Turn the bot on: it is greedy and will eventually trap itself.<\/li>\n<li>Make <i>bu<\/i> a different picture to see the trail of directions.<\/li><\/ul>"},{"id":"22","group":"Other games","title":"Breakout","sub":"bricks as background tiles, sprite-to-BG collision","code":"// Bricks are 16×8 background images; the ball tests the map under its corners.\n// Left/right moves, A launches. Clear the wall to win.\n\nconst row = (a, b, c, n) => a + b.repeat(n) + c;\nconst isBrick = (n) => /^(brick|stone)/.test(n);\nconst brick = (fill) => art([row(\"\", \"3\", \"\", 16), row(\"3\", \"1\", \"3\", 14), ...Array(4).fill(row(\"31\", fill, \"13\", 12)), row(\"3\", \"1\", \"3\", 14), row(\"\", \"3\", \"\", 16)].join(\"\\n\"));\nconst ROWS = 5, COLS = 9;\n\nconst Paddle = component(\"Paddle\")\n  .sprite(\"bar\", art([row(\".\", \"3\", \".\", 22), row(\"3\", \"2\", \"3\", 22), row(\"32\", \"1\", \"23\", 20), row(\"32\", \"1\", \"23\", 20), row(\"3\", \"2\", \"3\", 22), row(\".\", \"3\", \".\", 22)].join(\"\\n\")))\n  .hitbox(0, 0, 24, 6)\n  .onFrame((self, w) => { self.x = Math.max(8, Math.min(128, self.x + w.input.axis().x * 3)); });\n\nconst Ball = component(\"Ball\")\n  .sprite(\"ball\", art`\n    .3333...\n    322223..\n    320223..\n    322223..\n    322223..\n    .3333...\n  `)\n  .hitbox(0, 0, 6, 6)\n  .attr(\"vx\", { type: \"fix\" })\n  .attr(\"vy\", { type: \"fix\" })\n  .attr(\"stuck\", { type: \"bool\", init: true })\n  .onFrame((self, w) => {\n    const p = w.paddle, s = w.param(\"speed\");\n    if (self.stuck) {\n      self.x = p.x + 9; self.y = p.y - 6;\n      if (w.input.pressed(\"A\")) { self.stuck = false; self.vx = s * 0.6; self.vy = -s; }\n      return;\n    }\n    const probe = () => {\n      for (const [ox, oy] of [[0, 0], [5, 0], [0, 5], [5, 5]]) {\n        const n = w.bg.at(self.x + ox, self.y + oy);\n        if (n !== \"sky\") return { n, x: self.x + ox, y: self.y + oy };\n      }\n      return null;\n    };\n    for (const axis of [\"x\", \"y\"]) {\n      const v = axis === \"x\" ? \"vx\" : \"vy\";\n      self[axis] += self[v];\n      const hit = probe();\n      if (!hit) continue;\n      self[axis] -= self[v];\n      self[v] = -self[v];\n      if (isBrick(hit.n)) w.emit(\"brick\", { x: hit.x, y: hit.y });\n      else w.sfx(\"wall\");\n    }\n    if (self.vy > 0 && self.hits(p)) {\n      self.vy = -Math.abs(self.vy);\n      self.vx = ((self.x + 3 - (p.x + 12)) / 12) * s * 1.4;\n      w.sfx(\"pad\");\n    }\n    if (self.y > 144) w.emit(\"lost\");\n  });\n\nGame(\"breakout\")\n  .screen(160, 144)\n  .param(\"speed\", slider({ min: 1, max: 3, step: 0.25, value: 1.5, label: \"Ball speed\", unit: \"px/f\", live: true }))\n  .tiles({\n    sky: art`\n      00000000\n      00000000\n      00000000\n      00000000\n      00000000\n      00000000\n      00000000\n      00000000\n    `,\n    wall: art`\n      32222223\n      32111123\n      32111123\n      32111123\n      32111123\n      32111123\n      32111123\n      32222223\n    `,\n    brick: brick(\"2\"),\n    stone: brick(\"1\"),\n  })\n  .background((bg) => {\n    bg.fill(\"sky\");\n    bg.rect(0, 1, 20, 1, \"wall\");\n    bg.rect(0, 1, 1, 17, \"wall\");\n    bg.rect(19, 1, 1, 17, \"wall\");\n    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) bg.set(1 + c * 2, 3 + r, r % 2 ? \"stone\" : \"brick\");\n  })\n  .place(Ball)\n  .place(Paddle, { x: 68, y: 128 })\n  .attr(\"score\", { type: \"u16\" })\n  .attr(\"lives\", { type: \"u8\", init: 3 })\n  .attr(\"left\", { type: \"u8\", init: ROWS * COLS })\n  .sfx(\"brick\", { f: 990, ms: 40 })\n  .sfx(\"pad\", { f: 440, ms: 40 })\n  .sfx(\"wall\", { f: 330, ms: 20, vol: 0.3 })\n  .sfx(\"lost\", { f: 200, to: 60, ms: 300 })\n  .on(\"brick\", (w, e) => {\n    const { cx, cy } = w.bg.cell(e.x, e.y);\n    const left = w.bg.get(cx, cy).endsWith(\".1\") ? cx - 1 : cx;\n    w.bg.set(left, cy, \"sky\").set(left + 1, cy, \"sky\");\n    w.score += 10; w.left--; w.sfx(\"brick\");\n    if (w.left === 0) w.end(\"clear\");\n  })\n  .on(\"lost\", (w) => {\n    w.lives--; w.sfx(\"lost\"); w.ball.stuck = true;\n    if (w.lives === 0) w.end(\"out\");\n  })\n  .bot((w) => {\n    const b = w.ball, p = w.paddle;\n    if (b.stuck) return w.frame % 30 === 0 ? \"A\" : null;\n    const t = b.x + 3 - 12 - p.x;\n    return t < -3 ? \"left\" : t > 3 ? \"right\" : null;\n  })\n  .hud((w, at) => {\n    at(0, 0).text(\"SCORE %04d\", w.score);\n    at(13, 0).text(\"BALLS %d\", w.lives);\n    if (w.over) { at(5, 10).text(w.left ? \"GAME OVER\" : \" CLEARED \"); at(4, 12).text(\"PRESS START\"); }\n  })\n  .build();\n","notes":"<h1>Breakout<\/h1>\n<p>The bricks never touch OAM. A 16×8 brick is two background tiles (<i>brick<\/i> and <i>brick.1<\/i>); the ball reads <code>w.bg.at(x, y)<\/code> under its four corners, and the <i>brick<\/i> rule clears both halves.<\/p>\n<p>The brick art is generated by a small build-time function, so two rows of colour cost two short calls.<\/p>\n<h3>Try<\/h3>\n<ul><li>Raise <b>Ball speed<\/b> past 2.5: at 3 px a frame the corner test can tunnel through a brick edge.<\/li>\n<li>Turn the bot on and leave it.<\/li><\/ul>"},{"id":"23","group":"Other games","title":"Flappy","sub":"hardware scroll, writing columns ahead of the camera","code":"// The 32×32 background map scrolls; each time the camera passes eight pixels a\n// new column is written just off the right edge. A flaps.\n\nconst GS = 5;                                       // gap size in tiles\nconst writeCol = (w, g) => {\n  const col = g % 32, k = (g - 28) % 7, pipe = g >= 28 && k < 2;\n  if (pipe && k === 0) w.gap = Math.max(3, Math.min(11, w.gap + w.rand(7) - 3));   // drift, not jump\n  for (let r = 0; r < 18; r++) {\n    let t = \"sky\";\n    if (r >= 16) t = \"ground\";\n    else if (pipe && r >= 2 && (r < w.gap || r >= w.gap + GS)) {\n      const edge = r === w.gap - 1 || r === w.gap + GS;\n      t = (edge ? \"cap\" : \"pipe\") + (k === 0 ? \"L\" : \"R\");\n    }\n    w.bg.set(col, r, t);\n  }\n};\nconst BIRD = `\n  ................\n  ......3333......\n  ....33222233....\n  ...3222220023...\n  ..322222203023..\n  ..322222200003..\n  .33332222222233.\n  3111132222233333\n  3111132222322223\n  .33332222223333.\n  ..32222222223...\n  ...3322222233...\n  .....333333.....\n`;\n\nconst Bird = component(\"Bird\")\n  .sprite(\"idle\", art(BIRD))\n  .sprite(\"flap\", art(BIRD.replace(\"..322222203023..\", \"..311112203023..\").replace(\"..322222200003..\", \".31111322000033.\").replace(\"3111132222233333\", \"3222222222233333\").replace(\"3111132222322223\", \"3222222222322223\")))\n  .hitbox(3, 2, 10, 10)\n  .attr(\"vy\", { type: \"fix\" })\n  .attr(\"flap\", { type: \"u8\" })\n  .onFrame((self, w) => {\n    if (w.input.pressed(\"A\")) { self.vy = -w.param(\"flap\"); self.flap = 8; w.sfx(\"flap\"); }\n    if (self.flap) self.flap--;\n    self.vy = Math.min(4, self.vy + w.param(\"gravity\"));\n    self.y = Math.max(16, self.y + self.vy);\n    for (const [ox, oy] of [[3, 2], [12, 2], [3, 11], [12, 11]]) {\n      if (w.bg.at(self.x + ox, self.y + oy) !== \"sky\") { w.sfx(\"crash\"); w.end(\"crash\"); }\n    }\n  })\n  .draw((self) => (self.flap ? \"flap\" : \"idle\"));\n\nGame(\"flappy\")\n  .screen(160, 144)\n  .param(\"speed\", slider({ min: 0.5, max: 2.5, step: 0.25, value: 1.25, label: \"Scroll\", unit: \"px/f\", live: true }))\n  .param(\"gravity\", slider({ min: 0.08, max: 0.4, step: 0.02, value: 0.18, label: \"Gravity\", live: true }))\n  .param(\"flap\", slider({ min: 2, max: 5, step: 0.25, value: 2.75, label: \"Flap\", live: true }))\n  .tiles({\n    sky: art`\n      00000000\n      00000000\n      00000000\n      00000000\n      00000000\n      00000000\n      00000000\n      00000000\n    `,\n    ground: art`\n      33333333\n      21212121\n      12121212\n      11111111\n      11111111\n      11111111\n      11111111\n      11111111\n    `,\n    pipeL: art`\n      03211222\n      03211222\n      03211222\n      03211222\n      03211222\n      03211222\n      03211222\n      03211222\n    `,\n    pipeR: art`\n      22222230\n      22222230\n      22222230\n      22222230\n      22222230\n      22222230\n      22222230\n      22222230\n    `,\n    capL: art`\n      33333333\n      31112222\n      31112222\n      31112222\n      31112222\n      31112222\n      31112222\n      33333333\n    `,\n    capR: art`\n      33333333\n      22222223\n      22222223\n      22222223\n      22222223\n      22222223\n      22222223\n      33333333\n    `,\n  })\n  .background((bg) => {\n    bg.fill(\"sky\");\n    bg.rect(0, 16, 32, 2, \"ground\");\n  })\n  .place(Bird, { x: 40, y: 60 })\n  .attr(\"dist\", { type: \"u16\" })\n  .attr(\"acc\", { type: \"fix\" })\n  .attr(\"gen\", { type: \"u16\", init: 21 })\n  .attr(\"gap\", { type: \"u8\", init: 7 })\n  .attr(\"score\", { type: \"u16\" })\n  .sfx(\"flap\", { f: 300, to: 600, ms: 40, vol: 0.3 })\n  .sfx(\"crash\", { f: 100, ms: 300, wave: \"noise\" })\n  .onFrame((w) => {\n    w.acc += w.param(\"speed\");\n    const px = Math.floor(w.acc);\n    w.acc -= px;\n    w.dist += px;\n    while (w.gen * 8 < w.dist + 176) { writeCol(w, w.gen); w.gen++; }\n    w.bg.scroll(w.dist, 0);\n    w.score = Math.max(0, Math.floor((w.dist + 40 - 240) / 56) + 1);\n  })\n  .bot((w) => {\n    const b = w.bird;\n    let target = 64;\n    for (let x = b.x - 2; x < b.x + 84; x += 8) {\n      let top = -1, bot = -1, pipe = false;\n      for (let r = 2; r < 16; r++) { if (w.bg.at(x, r * 8) !== \"sky\") pipe = true; else { if (top < 0) top = r; bot = r; } }\n      if (pipe && top >= 0) { target = (top + bot + 1) * 4 - 7; break; }\n    }\n    return b.y > target + 9 && b.vy > 0 ? \"A\" : null;\n  })\n  .hud((w, at) => {\n    at(0, 0).text(\"SCORE %03d\", w.score);\n    if (w.over) { at(5, 7).text(\"GAME OVER\"); at(4, 9).text(\"PRESS START\"); }\n  })\n  .build();\n","notes":"<h1>Flappy<\/h1>\n<p>The DMG background is a 32×32 tile map with hardware scroll registers. <code>w.bg.scroll(x, y)<\/code> sets them; the map wraps, so a game that keeps scrolling only has to write each new column a little ahead of the right edge. That is the <code>while<\/code> loop in the world's onFrame, and it is the same trick most side-scrollers use.<\/p>\n<p>The flap sprite is made from the idle one with string replaces at build time.<\/p>\n<h3>Try<\/h3>\n<ul><li>Turn the bot on, then lower <b>Gravity<\/b> and raise <b>Scroll<\/b> until it fails.<\/li>\n<li>Set the C view beside the stage: the map only holds the visible 20×18 at boot; the rest is written at runtime.<\/li><\/ul>"},{"id":"24","group":"Other games","title":"Dodge","sub":"many sprites at once: OAM and the 10-per-line limit","code":"// Rocks fall; dodge them. Each 16×16 rock is two 8×16 objects, so a row of six\n// rocks on one line hits the DMG's limit of ten objects per scanline.\n\nconst Player = component(\"Player\")\n  .sprite(\"p\", art`\n    ......3333......\n    .....322223.....\n    .....320023.....\n    .....322223.....\n    ......3333......\n    ....33222233....\n    ...3222222223...\n    ..32.322223.23..\n    ..32.322223.23..\n    .....322223.....\n    .....322223.....\n    .....33..33.....\n    .....32..23.....\n    .....32..23.....\n    ....332..233....\n    ....333..333....\n  `)\n  .hitbox(5, 2, 6, 13)\n  .onFrame((self, w) => { self.x = Math.max(0, Math.min(144, self.x + w.input.axis().x * w.param(\"move\"))); });\n\nconst Rock = component(\"Rock\")\n  .sprite(\"rock\", art`\n    ................\n    .....333333.....\n    ...3322222233...\n    ..322221122223..\n    .32221111222223.\n    .32211112222223.\n    3222111222222223\n    3222222222211223\n    3222222222111223\n    3222222221112223\n    .32222222222223.\n    .32222222222223.\n    ..322222222223..\n    ...3322222233...\n    .....333333.....\n  `)\n  .hitbox(3, 3, 10, 10)\n  .attr(\"vy\", { type: \"fix\" })\n  .onFrame((self, w) => {\n    self.y += self.vy;\n    if (self.hits(w.player)) w.emit(\"hit\");\n    if (self.y > 144) { self.destroy(); w.dodged++; }\n  })\n  .draw((self, w) => ({ flipX: (w.frame >> 3) % 2 === 0 }));\n\nGame(\"dodge\")\n  .screen(160, 144)\n  .param(\"rate\", slider({ min: 80, max: 800, step: 20, value: 260, label: \"Rock every\", unit: \"ms\", live: true }))\n  .param(\"move\", slider({ min: 1, max: 4, step: 0.5, value: 2, label: \"Run speed\", unit: \"px/f\", live: true }))\n  .param(\"rotate\", toggle({ value: false, label: \"Rotate OAM\", live: true }))\n  .tiles({\n    ground: art`\n      33333333\n      21212121\n      12121212\n      11111111\n      11111111\n      11111111\n      11111111\n      11111111\n    `,\n  })\n  .background((bg) => { bg.fill(\"blank\"); bg.rect(0, 16, 20, 2, \"ground\"); })\n  .place(Player, { x: 72, y: 112 })\n  .pool(\"rocks\", Rock, 18)\n  .attr(\"dodged\", { type: \"u16\" })\n  .attr(\"lives\", { type: \"u8\", init: 3 })\n  .attr(\"hurt\", { type: \"u8\" })\n  .sfx(\"hit\", { f: 150, ms: 200, wave: \"noise\" })\n  .timer(\"rock\", { every: $.param(\"rate\") }, (w) => {\n    const r = w.spawn(\"rocks\", { x: w.rand(144), y: -16 });\n    if (r) r.vy = 1 + w.rand(16) / 16 + w.dodged / 80;\n  })\n  .onFrame((w) => {\n    if (w.hurt) w.hurt--;\n    w.oamStart = w.param(\"rotate\") ? w.frame : 0;     // cycle priority: flicker instead of vanish\n    w.player.visible = !w.hurt || (w.frame & 4) === 0;\n  })\n  .on(\"hit\", (w) => {\n    if (w.hurt) return;\n    w.hurt = 60; w.lives--; w.sfx(\"hit\"); w.toast(\"OUCH\", w.lives + \" left\");\n    if (w.lives === 0) w.end(\"hit\");\n  })\n  .bot((w) => {\n    const p = w.player, danger = w.pool(\"rocks\").filter((r) => r.y > 40 && r.y < 120 && Math.abs(r.x - p.x) < 22);\n    if (!danger.length) return p.x < 64 ? \"right\" : p.x > 80 ? \"left\" : null;\n    const left = danger.filter((r) => r.x < p.x).length, right = danger.length - left;\n    return left > right || p.x < 16 ? \"right\" : \"left\";\n  })\n  .hud((w, at) => {\n    at(0, 0).text(\"DODGED %03d\", w.dodged);\n    at(14, 0).text(\"LIFE %d\", w.lives);\n    if (w.over) { at(5, 8).text(\"GAME OVER\"); at(4, 10).text(\"PRESS START\"); }\n  })\n  .build();\n","notes":"<h1>Dodge<\/h1>\n<p>The DMG reads OAM each line and draws at most ten objects there. Extra objects simply vanish on that line, which looks like a rock losing a stripe. Turn on the <b>lines<\/b> overlay on the stage to see which lines are over budget, and watch the histogram in <b>Budget<\/b>.<\/p>\n<p>Games hide the loss by rotating which objects come first each frame. <code>w.oamStart = w.frame<\/code> does that here: turn on <b>Rotate OAM<\/b> and the missing stripes become flicker, shared among the rocks.<\/p>\n<h3>Try<\/h3>\n<ul><li>Set <b>Rock every<\/b> to 80 ms, then toggle Rotate OAM.<\/li>\n<li>Switch objSize to 8 with <code>.objSize(8)<\/code>: each rock becomes four objects.<\/li><\/ul>"},{"id":"25","group":"Other games","title":"Lights Out","sub":"toggling 16×16 background images, a cursor sprite","code":"// Pressing a light toggles it and its four neighbours. Turn them all off.\n// The board state is the background map itself.\n\nconst N = 5;\nconst tile16 = (fill, mark) => art([\n  \"0000000000000000\",\n  \"0\" + \"3\".repeat(14) + \"0\",\n  ...Array.from({ length: 12 }, (_, i) => \"03\" + (i === 2 && mark ? fill.repeat(2) + mark.repeat(3) + fill.repeat(7) : fill.repeat(12)) + \"30\"),\n  \"0\" + \"3\".repeat(14) + \"0\",\n  \"0000000000000000\",\n].join(\"\\n\"));\nconst at16 = (r, c) => [5 + c * 2, 4 + r * 2];\nconst flip = (w, r, c) => {\n  for (const [dr, dc] of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]]) {\n    const rr = r + dr, cc = c + dc;\n    if (rr < 0 || cc < 0 || rr >= N || cc >= N) continue;\n    const [x, y] = at16(rr, cc);\n    w.bg.set(x, y, w.bg.get(x, y) === \"on\" ? \"off\" : \"on\");\n  }\n};\nconst solved = (w) => { for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (w.bg.get(...at16(r, c)) === \"on\") return false; return true; };\nconst scramble = (w) => { for (let i = 0; i < w.param(\"scramble\") + w.level; i++) flip(w, w.rand(N), w.rand(N)); };\n\nconst Cursor = component(\"Cursor\")\n  .sprite(\"box\", art`\n    333..........333\n    3..............3\n    3..............3\n    ................\n    ................\n    ................\n    ................\n    ................\n    ................\n    ................\n    ................\n    ................\n    ................\n    3..............3\n    3..............3\n    333..........333\n  `)\n  .attr(\"r\", { type: \"u8\", init: 2 })\n  .attr(\"c\", { type: \"u8\", init: 2 })\n  .onFrame((self, w) => {\n    const d = w.input.dpad();\n    self.r = Math.max(0, Math.min(N - 1, self.r + d.y));\n    self.c = Math.max(0, Math.min(N - 1, self.c + d.x));\n    const [x, y] = at16(self.r, self.c);\n    self.x = x * 8; self.y = y * 8;\n    if (w.input.pressed(\"A\")) w.emit(\"press\", { r: self.r, c: self.c });\n  });\n\nGame(\"lights-out\")\n  .screen(160, 144)\n  .param(\"scramble\", slider({ min: 1, max: 15, value: 4, label: \"Scramble presses\", live: true }))\n  .tiles({ on: tile16(\"0\", \"1\"), off: tile16(\"2\"), felt: art`\n      11111111\n      11111111\n      11121111\n      11111111\n      11111111\n      11111111\n      11111211\n      11111111\n    ` })\n  .background((bg) => {\n    bg.fill(\"felt\");\n    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) bg.set(...at16(r, c), \"off\");\n  })\n  .place(Cursor)\n  .attr(\"level\", { type: \"u8\", init: 1 })\n  .attr(\"moves\", { type: \"u16\" })\n  .init((w) => scramble(w))\n  .sfx(\"click\", { f: 880, ms: 25 })\n  .sfx(\"win\", { f: 523, to: 1046, ms: 300 })\n  .on(\"press\", (w, e) => {\n    flip(w, e.r, e.c);\n    w.moves++;\n    w.sfx(\"click\");\n    if (solved(w)) {\n      w.toast(\"SOLVED\", w.moves + \" moves\");\n      w.sfx(\"win\");\n      w.level++; w.moves = 0;\n      scramble(w);\n    }\n  })\n  .hud((w, at) => {\n    at(1, 1).text(\"LEVEL %02d\", w.level);\n    at(11, 1).text(\"MOVES %02d\", w.moves);\n    at(3, 16).text(\"A TOGGLES A CROSS\");\n  })\n  .build();\n","notes":"<h1>Lights Out<\/h1>\n<p>Each light is a 16×16 background image (four tiles) stamped with <code>bg.set<\/code>, and the puzzle state is read back with <code>bg.get<\/code>. Scrambling applies random presses to a solved board, so every level can be solved.<\/p>\n<p>The two light images come from one build-time function with a fill and an optional highlight.<\/p>\n<h3>Try<\/h3>\n<ul><li>Raise <b>Scramble presses<\/b> between levels; it is live, so the next scramble uses it.<\/li>\n<li>Change <code>N<\/code> to 6: <code>at16<\/code> needs to move the board left.<\/li><\/ul>"},{"id":"26","group":"Other games","title":"Life","sub":"a cellular automaton on the background, seeded at build time","code":"// Conway's Life on a 20×17 background. The starting soup is generated at build\n// time from a seed and a density, so it ships in ROM. A toggles a cell, B steps,\n// Select runs or pauses.\n\nconst COLS = 20, ROWS = 17, TOP = 1;\n\nconst step = (w) => {\n  const g = new Uint8Array(COLS * ROWS);\n  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) g[y * COLS + x] = w.bg.get(x, y + TOP) === \"live\" ? 1 : 0;\n  let pop = 0;\n  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {\n    let n = 0;\n    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (dx || dy) n += g[((y + dy + ROWS) % ROWS) * COLS + ((x + dx + COLS) % COLS)];\n    const was = g[y * COLS + x], now = n === 3 || (was && n === 2) ? 1 : 0;\n    if (now !== was) w.bg.set(x, y + TOP, now ? \"live\" : \"dead\");\n    pop += now;\n  }\n  w.pop = pop; w.gen++;\n};\n\nconst Cursor = component(\"Cursor\")\n  .sprite(\"c\", art`\n    33....33\n    3......3\n    ........\n    ........\n    ........\n    ........\n    3......3\n    33....33\n  `)\n  .attr(\"cx\", { type: \"u8\", init: 10 })\n  .attr(\"cy\", { type: \"u8\", init: 8 })\n  .onFrame((self, w) => {\n    const d = w.input.dpad();\n    self.cx = (self.cx + d.x + COLS) % COLS;\n    self.cy = (self.cy + d.y + ROWS) % ROWS;\n    self.x = self.cx * 8; self.y = (self.cy + TOP) * 8;\n    if (w.input.pressed(\"A\")) w.bg.set(self.cx, self.cy + TOP, w.bg.get(self.cx, self.cy + TOP) === \"live\" ? \"dead\" : \"live\");\n  });\n\nGame(\"life\")\n  .screen(160, 144)\n  .param(\"density\", slider({ min: 5, max: 60, value: 28, label: \"Soup density\", unit: \"%\" }))\n  .param(\"rate\", slider({ min: 1, max: 30, value: 6, label: \"Frames per generation\", live: true }))\n  .seed(1971)\n  .tiles({\n    live: art`\n      02222220\n      23333332\n      23333332\n      23333332\n      23333332\n      23333332\n      23333332\n      02222220\n    `,\n    dead: art`\n      00000000\n      00000000\n      00000000\n      00010000\n      00000000\n      00000000\n      00000000\n      00000000\n    `,\n  })\n  .background((bg, ctx) => {\n    bg.fill(\"dead\");\n    const d = ctx.param(\"density\").value;\n    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (ctx.rand(100) < d) bg.set(x, y + TOP, \"live\");\n  })\n  .place(Cursor)\n  .attr(\"run\", { type: \"bool\", init: true })\n  .attr(\"tick\", { type: \"u8\" })\n  .attr(\"gen\", { type: \"u16\" })\n  .attr(\"pop\", { type: \"u16\" })\n  .onFrame((w) => {\n    if (w.input.pressed(\"select\")) w.run = !w.run;\n    if (w.input.pressed(\"B\")) step(w);\n    if (w.run && ++w.tick >= w.param(\"rate\")) { w.tick = 0; step(w); }\n  })\n  .hud((w, at) => at(0, 0).text(\"GEN %05d  POP %03d %s\", w.gen, w.pop, w.run ? \">\" : \"=\"))\n  .build();\n","notes":"<h1>Life<\/h1>\n<p>The <code>background<\/code> lambda receives a build context with <code>ctx.param()<\/code> and <code>ctx.rand()<\/code> (seeded by <code>.seed()<\/code>). The soup it draws is a constant: the same map every time, and it appears byte for byte in the C view's <code>bg_map<\/code>.<\/p>\n<p>The runtime step reads the map into a temporary array, counts neighbours on a torus, and writes back only the cells that changed, as a DMG game would to stay inside VBlank.<\/p>\n<p>Controls: d-pad moves, A toggles, B steps once, <kbd>Shift<\/kbd> (Select) runs or pauses.<\/p>\n<h3>Try<\/h3>\n<ul><li>Move <b>Soup density<\/b>: build-time, so the program rebuilds with a new map.<\/li>\n<li>Change <code>.seed(1971)<\/code>.<\/li><\/ul>"},{"id":"30","group":"Limits","title":"Scanline stress test","sub":"40 objects, 10 per line, and OAM rotation","code":"// Up to 40 small sprites in a few layouts. Watch the stage's lines overlay and\n// the Budget view while you change the count and the layout.\n\nconst Ball = component(\"Ball\")\n  .sprite(\"b\", art`\n    ..3333..\n    .322223.\n    32200223\n    32202223\n    32222223\n    32222223\n    .322223.\n    ..3333..\n  `)\n  .onFrame((self, w) => {\n    const i = self.index, t = w.frame, L = w.param(\"layout\");\n    if (L === \"row\") { self.x = 2 + i * 3.9; self.y = 68; }\n    else if (L === \"wave\") { self.x = 2 + i * 3.9; self.y = 68 + Math.sin(t / 20 + i / 4) * 40; }\n    else if (L === \"grid\") { self.x = 8 + (i % 10) * 15; self.y = 24 + Math.floor(i / 10) * 26 + ((t >> 2) % 8); }\n    else { self.x = (i * 53) % 152; self.y = (t * (1 + (i % 3)) + i * 37) % 160 - 8; }\n  });\n\nGame(\"scanlines\")\n  .screen(160, 144)\n  .objSize(8)\n  .param(\"count\", slider({ min: 1, max: 40, value: 16, label: \"Objects\", live: true }))\n  .param(\"layout\", choice({ options: [\"row\", \"wave\", \"grid\", \"rain\"], value: \"row\", label: \"Layout\", live: true }))\n  .param(\"rotate\", toggle({ value: false, label: \"Rotate OAM\", live: true }))\n  .pool(\"balls\", Ball, 40)\n  .onFrame((w) => {\n    const alive = w.pool(\"balls\");\n    if (alive.length < w.param(\"count\")) w.spawn(\"balls\");\n    else if (alive.length > w.param(\"count\")) alive[alive.length - 1].destroy();\n    w.oamStart = w.param(\"rotate\") ? w.frame : 0;\n  })\n  .hud((w, at) => {\n    at(0, 0).text(\"OBJ %02d  %s\", w.pool(\"balls\").length, w.param(\"layout\").toUpperCase());\n    at(14, 0).text(w.param(\"rotate\") ? \"ROT ON\" : \"ROT --\");\n  })\n  .build();\n","notes":"<h1>Scanline stress test<\/h1>\n<p>Two hardware limits, both modelled by the stage:<\/p>\n<ul><li><b>40 objects<\/b> in OAM. Beyond that nothing more is drawn; the Budget view counts the misses.<\/li>\n<li><b>10 objects per scanline.<\/b> The PPU picks the first ten that overlap each line, in OAM order, and skips the rest for that line only.<\/li><\/ul>\n<p>With <i>row<\/i>, everything shares eight lines, so anything past ten is invisible. <i>wave<\/i> spreads the load; <i>grid<\/i> keeps it at ten; <i>rain<\/i> is random. Rotating OAM priority each frame (<code>w.oamStart<\/code>) turns invisibility into flicker.<\/p>\n<p><code>Math.sin<\/code> in a runtime lambda gets a lint note: on the device it becomes a lookup table.<\/p>"},{"id":"31","group":"Limits","title":"Boss: object size and OAM cost","sub":"objSize from a build-time param; procedural art","code":"// A 32×32 boss and orbiting minions. The art is computed from distance fields at\n// build time. Object size is a build-time choice: 8×8 objects cost twice as many.\n\nconst disc = (n, paint) => {\n  const rows = [];\n  for (let y = 0; y < n; y++) {\n    let s = \"\";\n    for (let x = 0; x < n; x++) s += paint(x - n / 2 + 0.5, y - n / 2 + 0.5, n / 2);\n    rows.push(s);\n  }\n  return art(rows.join(\"\\n\"));\n};\nconst BOSS = disc(32, (x, y, r) => {\n  const d = Math.hypot(x, y);\n  if (d > r) return \".\";\n  if (d > r - 1.6) return \"3\";\n  if (Math.hypot(x + 6, y + 4) < 3.2 || Math.hypot(x - 6, y + 4) < 3.2) return Math.hypot(Math.abs(x) - 6, y + 4) < 1.4 ? \"3\" : \"0\";\n  if (y > 5 && y < 8.5 && Math.abs(x) < 9) return \"3\";\n  return d < r * 0.55 ? \"1\" : \"2\";\n});\nconst MINION = disc(16, (x, y, r) => {\n  const d = Math.hypot(x, y);\n  return d > r ? \".\" : d > r - 1.4 ? \"3\" : Math.abs(x) < 3 && Math.abs(y + 1) < 2 ? \"0\" : \"2\";\n});\n\nconst Boss = component(\"Boss\")\n  .sprite(\"boss\", BOSS)\n  .onFrame((self, w) => {\n    self.x = 64 + Math.sin(w.frame / 50) * 40;\n    self.y = 52 + Math.sin(w.frame / 31) * 16;\n  });\n\nconst Minion = component(\"Minion\")\n  .sprite(\"m\", MINION)\n  .onFrame((self, w) => {\n    const b = w.boss, a = w.frame / 30 + (self.index * Math.PI * 2) / w.param(\"minions\");\n    self.x = b.x + 8 + Math.cos(a) * w.param(\"orbit\");\n    self.y = b.y + 8 + Math.sin(a) * w.param(\"orbit\");\n  });\n\nGame(\"boss\")\n  .screen(160, 144)\n  .param(\"obj\", choice({ options: [16, 8], value: 16, label: \"Object size\" }))\n  .param(\"minions\", slider({ min: 0, max: 10, value: 6, label: \"Minions\", live: true }))\n  .param(\"orbit\", slider({ min: 18, max: 60, value: 32, label: \"Orbit radius\", unit: \"px\", live: true }))\n  .objSize($.param(\"obj\"))\n  .place(Boss, { x: 64, y: 52 })\n  .pool(\"minions\", Minion, 10)\n  .onFrame((w) => {\n    const alive = w.pool(\"minions\");\n    if (alive.length < w.param(\"minions\")) w.spawn(\"minions\");\n    else if (alive.length > w.param(\"minions\")) alive[alive.length - 1].destroy();\n  })\n  .hud((w, at) => at(0, 0).text(\"8X%d OBJECTS  MINIONS %d\", w.param(\"obj\"), w.pool(\"minions\").length))\n  .build();\n","notes":"<h1>Boss: object size and OAM cost<\/h1>\n<p>The DMG has one global object size: 8×8 or 8×16. A 32×32 sprite is 8 objects in 8×16 mode and 16 in 8×8 mode; each 16×16 minion is 2 or 4. <code>.objSize($.param(\"obj\"))<\/code> takes a build-time choice, so flipping it rebuilds and the Budget view recounts.<\/p>\n<p>Both sprites are drawn by build-time functions that sample a distance field. <code>Math.hypot<\/code> is fine here: build-time lambdas run in the workbench and never reach the device.<\/p>\n<h3>Try<\/h3>\n<ul><li>Choose <b>Object size<\/b> 8 and raise <b>Minions<\/b> to 10: 16 + 40 objects asks for 56, and only 40 are drawn.<\/li>\n<li>Shrink the orbit so minions crowd the boss's lines and watch the 10-per-line limit bite.<\/li><\/ul>"}];</script>
